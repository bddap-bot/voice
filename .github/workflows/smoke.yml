name: browser smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run smoke -- --output smoke-artifacts --baseline test/smoke-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: smoke-artifacts
