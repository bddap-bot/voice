<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:; media-src blob:;">
<title>voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0c; color: #e6e6e6; font: 16px/1.4 system-ui, sans-serif;
         min-height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: #9a9a9a; font-size: 14px; }
  #status.err { color: #ff6b6b; } #status.ok { color: #6bd47a; }
  .row { display: flex; gap: 8px; padding: 8px 16px; align-items: center; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 80px; background: #151517; color: inherit; border: 1px solid #333; border-radius: 6px; padding: 8px; }
  button { background: #1d1d20; color: inherit; border: 1px solid #3a3a3f; border-radius: 6px; padding: 8px 14px; font: inherit; }
  button.primary { background: #2c5cff; border-color: #2c5cff; }
  .hidden { display: none !important; }
  #talk { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #hold { width: min(70vw, 320px); height: min(70vw, 320px); border-radius: 50%; font-size: 24px;
          background: #1d1d20; border: 3px solid #3a3a3f; touch-action: none; user-select: none; -webkit-user-select: none; }
  #hold.on { background: #b3261e; border-color: #ff6b6b; }
  #live.on { background: #1f6f3f; border-color: #6bd47a; }
  #log { padding: 0 16px 16px; font-size: 15px; white-space: pre-wrap; }
  #log .me { color: #9fb7ff; } #log .hub { color: #e6e6e6; }
</style>
</head>
<body>
<header>
  <h1>voice</h1>
  <span id="status">paste token to connect</span>
</header>

<div id="entry">
  <div class="row">
    <textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false" inputmode="text"></textarea>
  </div>
  <div class="row">
    <button id="connect" class="primary">Connect</button>
  </div>
</div>

<div id="saved" class="row hidden">
  <span>🔒 token saved on this device</span>
  <button id="reenter">Use a different token</button>
  <button id="forget">Forget token</button>
</div>

<div id="talk" class="hidden">
  <button id="hold">hold to talk</button>
</div>
<div id="modes" class="row hidden">
  <button id="live">Live call</button>
</div>
<audio id="remote" autoplay playsinline></audio>
<div id="log"></div>

<script type="module">
import wbgInit, { init as wasmInit, connect, send, send_only, recv } from 'https://bddap-bot.github.io/botq/botq_dash_wasm.js';
import { createPtt, createLivePtt } from './ptt.js';

const KEY = 'voice.token';
const ALPN = 'voice-web/1';
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();

function setStatus(text, cls = '') { $('status').textContent = text; $('status').className = cls; }
function showSavedState(saved) { $('entry').classList.toggle('hidden', saved); $('saved').classList.toggle('hidden', !saved); }
function say(cls, text) {
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  $('log').prepend(d);
  return d;
}

function b64urlToText(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return dec.decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
}
const request = (bytes) => send(bytes);
const text = (bytes) => dec.decode(bytes);

let busy = false;
async function withStream(fn) {
  while (busy) await new Promise((r) => setTimeout(r, 50));
  busy = true;
  try { return await fn(); } finally { busy = false; }
}

async function upload(wav) {
  const frame = new Uint8Array(6 + wav.length);
  frame.set(enc.encode('utter\n')); frame.set(wav, 6);
  const reply = text(await withStream(() => request(frame)));
  if (reply !== 'ok') throw new Error(reply);
  say('me', `🎙 sent ${(wav.length / 32000).toFixed(1)}s`);
}

async function pollOnce() {
  const reply = await withStream(async () => {
    const r = await request(enc.encode('poll'));
    const nl = r.indexOf(10);
    const head = text(nl < 0 ? r : r.subarray(0, nl));
    if (head === 'none') return null;
    const [tag, t, w] = head.split(' ');
    const tlen = Number(t), wlen = Number(w);
    const body = r.subarray(nl + 1);
    if (tag !== 'reply' || nl < 0 || body.length < tlen + wlen) throw new Error(head);
    const out = { text: text(body.subarray(0, tlen)), wav: body.subarray(tlen, tlen + wlen) };
    const ack = text(await request(enc.encode('ack')));
    if (ack !== 'ok') throw new Error(`ack: ${ack}`);
    return out;
  });
  if (!reply) return false;
  say('hub', reply.text);
  const url = URL.createObjectURL(new Blob([reply.wav], { type: 'audio/wav' }));
  const audio = new Audio(url);
  audio.onended = () => URL.revokeObjectURL(url);
  audio.play().catch(() => setStatus('tap to enable audio', 'err'));
  return true;
}

function capture(stream) {
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  let cb = () => {};
  proc.onaudioprocess = (e) => cb(e.inputBuffer.getChannelData(0).slice());
  src.connect(proc); proc.connect(ctx.destination);
  return { rate: ctx.sampleRate, onChunk: (f) => { cb = f; }, close: () => { proc.disconnect(); src.disconnect(); ctx.close(); } };
}

const ptt = createPtt({ mediaDevices: navigator.mediaDevices, capture, upload, onState: (s) => setStatus(s, s.startsWith('sent') ? 'ok' : s.includes('fail') || s.includes('refused') ? 'err' : '') });
const hold = $('hold');
const active = () => (LIVE.on ? LIVE.ptt : ptt);
const down = (e) => { e.preventDefault(); hold.classList.add('on'); if (LIVE.on) LIVE.report(`gesture down: ${e.type} ${e.pointerType || 'unknown'}`); active()?.hold().catch((err) => setStatus(`hold failed: ${err.message || err}`, 'err')); };
const up = (e) => { e.preventDefault(); hold.classList.remove('on'); if (LIVE.on) LIVE.report(`gesture up: ${e.type} ${e.pointerType || 'unknown'}`); active()?.release().catch((err) => setStatus(`release failed: ${err.message || err}`, 'err')); };
hold.addEventListener('pointerdown', down);
hold.addEventListener('pointerup', up);
hold.addEventListener('pointercancel', up);
hold.addEventListener('pointerleave', (e) => { if (active()?.held) up(e); });
hold.addEventListener('contextmenu', (e) => e.preventDefault());

async function start(token) {
  setStatus('decoding token…');
  let t;
  try { t = JSON.parse(b64urlToText(token.trim())); }
  catch { return setStatus('token is not valid base64url JSON', 'err'); }
  if (!t.endpoint_id || !t.secret) return setStatus('token missing endpoint_id/secret', 'err');
  try {
    setStatus('loading wasm…');
    await wbgInit();
    wasmInit();
    setStatus('connecting over iroh…');
    await connect(t.relay_url ? `${t.endpoint_id}@${t.relay_url}` : t.endpoint_id, ALPN);
    setStatus('authenticating…');
    const auth = JSON.parse(text(await request(enc.encode(JSON.stringify({ auth: t.secret })))));
    if (!auth.ok) return setStatus('auth rejected — wrong secret', 'err');
    localStorage.setItem(KEY, token.trim());
    $('token').value = '';
    showSavedState(true);
    $('talk').classList.remove('hidden');
    $('modes').classList.remove('hidden');
    LIVE.token = t;
    setStatus('connected — hold the button to talk', 'ok');
    while (!LIVE.on) {
      let served = false;
      try { served = await pollOnce(); } catch (e) { setStatus(`poll failed: ${e.message || e}`, 'err'); }
      if (!served) await new Promise((r) => setTimeout(r, 500));
    }
  } catch (e) {
    setStatus(`error: ${e && e.message ? e.message : e}`, 'err');
  }
}

let queue = Promise.resolve();
const sendFrame = (s) => { const p = queue.then(() => send_only(enc.encode(s))); queue = p.catch(() => {}); return p; };
const LIVE = {
  on: false, pc: null, ptt: null, ctx: null, token: null, report: () => {},
  silence() {
    this.ctx ??= new AudioContext();
    const src = this.ctx.createConstantSource(); src.offset.value = 0;
    const dst = this.ctx.createMediaStreamDestination(); src.connect(dst); src.start();
    return dst.stream.getAudioTracks()[0];
  },
};
function makeMeter(stream) {
  const analyser = LIVE.ctx.createAnalyser();
  analyser.fftSize = 1024;
  const source = LIVE.ctx.createMediaStreamSource(stream);
  source.connect(analyser);
  const values = new Float32Array(analyser.fftSize);
  let peak = 0;
  const sample = () => {
    analyser.getFloatTimeDomainData(values);
    let sum = 0;
    for (const value of values) sum += value * value;
    peak = Math.max(peak, Math.sqrt(sum / values.length));
  };
  const timer = setInterval(sample, 100);
  sample();
  return { read: () => { sample(); return peak; }, close: () => { clearInterval(timer); source.disconnect(); analyser.disconnect(); } };
}
async function liveStart() {
  const t = LIVE.token;
  setStatus('live: reconnecting…');
  await withStream(async () => {
    await connect(t.relay_url ? `${t.endpoint_id}@${t.relay_url}` : t.endpoint_id, ALPN);
    const auth = JSON.parse(text(await request(enc.encode(JSON.stringify({ auth: t.secret })))));
    if (!auth.ok) throw new Error('auth rejected');
    const ready = text(await request(enc.encode('live')));
    if (ready !== 'ready') throw new Error(ready);
  });
  const liveStatus = (s, cls = 'ok') => { s = String(s).slice(0, 190); setStatus(`live: ${s}`, cls); sendFrame(`state\n${s}`).catch(() => {}); };
  LIVE.report = liveStatus;
  liveStatus(`audio context ${LIVE.ctx.state}; playback ${$('remote').paused ? 'paused' : 'started'}`);
  const pc = new RTCPeerConnection();
  LIVE.pc = pc;
  const silence = LIVE.silence();
  const sender = pc.addTrack(silence, new MediaStream([silence]));
  const events = pc.createDataChannel('oai-events');
  let spoken = null;
  events.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'output_transcript.added') { spoken ??= say('hub', '(voice)'); spoken.textContent += m.item?.text ?? ''; }
    else if (m.type === 'turn.created' && m.turn?.role === 'assistant') spoken = null;
    else if (m.type === 'error') liveStatus(`data channel error: ${m.error?.message || m.error?.code || 'error'}`, 'err');
  };
  pc.ontrack = (e) => {
    const remote = $('remote');
    remote.srcObject = e.streams[0] ?? new MediaStream([e.track]);
    remote.play().then(() => liveStatus(`playback started; audio context ${LIVE.ctx.state}`)).catch((x) => liveStatus(`playback blocked: ${x.message || x}`, 'err'));
  };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    liveStatus(`media ${st}`, st === 'failed' || st === 'disconnected' ? 'err' : 'ok');
    if (st === 'failed') liveStop('media failed');
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise((r) => { if (pc.iceGatheringState === 'complete') r(); else { pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); setTimeout(r, 2000); } });
  await sendFrame(`offer\n${pc.localDescription.sdp}`);
  const local = {};
  for (const l of pc.localDescription.sdp.match(/^a=candidate:.*/gm) ?? []) {
    const [, proto, addr, typ] = /^a=candidate:\S+ \d+ (\S+) \d+ (\S+) \d+ typ (\S+)/.exec(l) ?? [];
    const kind = proto ? `${proto.toLowerCase()}${addr.includes(':') ? '6' : /^\d+(\.\d+){3}$/.test(addr) ? '4' : ''} ${typ}` : 'unparsed';
    local[kind] = (local[kind] ?? 0) + 1;
  }
  liveStatus(`offer sent, ${Object.entries(local).map(([k, n]) => `${k}×${n}`).join(' ') || 'no candidates'}`);
  LIVE.loop = (async () => {
    try {
      for (;;) {
        const f = text(await recv());
        const nl = f.indexOf('\n');
        const verb = nl < 0 ? f : f.slice(0, nl), body = nl < 0 ? '' : f.slice(nl + 1);
        if (verb === 'answer') await pc.setRemoteDescription({ type: 'answer', sdp: body });
        else if (verb === 'status') setStatus(`live: ${body}`, 'ok');
        else if (verb === 'you') say('me', `🎙 ${body}`);
        else if (verb === 'hub') say('hub', body);
        else if (verb === 'error') throw new Error(body);
      }
    } catch (e) { if (LIVE.on) liveStop(e.message || String(e)); }
  })();
  LIVE.ptt = createLivePtt({ mediaDevices: navigator.mediaDevices, sender, silence, send: sendFrame, makeMeter, onState: (s) => liveStatus(s, s.includes('refused') || s.includes('failed') ? 'err' : 'ok') });
}
async function liveStop(why) {
  if (!LIVE.on) return;
  LIVE.on = false;
  $('live').classList.remove('on');
  if (LIVE.ptt) await LIVE.ptt.release().catch(() => {});
  LIVE.ptt = null;
  if (LIVE.pc) LIVE.pc.close();
  LIVE.pc = null;
  try { await Promise.race([sendFrame(why ? `bye\n${why}` : 'bye'), new Promise((r) => setTimeout(r, 3000))]); } catch {}
  await Promise.race([LIVE.loop, new Promise((r) => setTimeout(r, 3000))]);
  LIVE.loop = null;
  if (why) say('hub', `live ended: ${why}`);
  start(localStorage.getItem(KEY));
}
$('live').addEventListener('click', async () => {
  if (LIVE.on) return liveStop();
  LIVE.on = true;
  $('live').classList.add('on');
  LIVE.ctx ??= new AudioContext();
  const resume = LIVE.ctx.resume();
  const play = $('remote').play();
  Promise.allSettled([resume, play]).then(([r, p]) => LIVE.report(`gesture audio: context=${LIVE.ctx.state} playback=${p.status}`));
  try { await liveStart(); } catch (e) { liveStop(e.message || String(e)); }
});

$('connect').addEventListener('click', () => start($('token').value));
$('reenter').addEventListener('click', () => { $('token').value = ''; showSavedState(false); $('token').focus(); });
$('forget').addEventListener('click', () => { localStorage.removeItem(KEY); showSavedState(false); $('talk').classList.add('hidden'); setStatus('token forgotten'); });

const saved = localStorage.getItem(KEY);
if (saved) { showSavedState(true); start(saved); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
