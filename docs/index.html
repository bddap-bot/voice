<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob: https://huggingface.co https://*.hf.co https://*.iroh.link wss://*.iroh.link https://*.iroh.link. wss://*.iroh.link.; img-src 'self' blob:; media-src blob:; object-src 'none'; base-uri 'none';">
<title>voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --desk: 118px; --status: 34px; --pad: 18px; --grip: 16px; --ledger-w: 22vw; --display-w: 24vw; --display-h: 24svh; --ledger-h: 20svh; --ledger-col: clamp(120px, var(--ledger-w), calc(100vw - 2 * var(--pad) - 2 * var(--grip) - 320px)); --display-col: clamp(120px, var(--display-w), calc(100vw - 2 * var(--pad) - 2 * var(--grip) - 200px - var(--ledger-col))); --wing: calc(min(var(--ledger-col), var(--display-col)) + var(--grip)); }
  * { box-sizing: border-box; }
  html { background: #08090d; }
  body { margin: 0; min-height: 100vh; background: #08090d; color: #f4eee5; font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
  .hidden { display: none !important; }
  header { position: fixed; z-index: 8; top: calc(var(--pad) + 4px); left: calc(var(--pad) + var(--ledger-col) + var(--grip)); right: calc(var(--pad) + var(--display-col) + var(--grip)); height: 26px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 12px; pointer-events: none; }
  #status { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #a5a5aa; } #status.err { color: #ff8585; } #status.ok { color: #75dc8b; }
  #elapsed { font: 20px/1 ui-monospace, monospace; color: #ded0bd; }
  textarea { width: 100%; min-height: 72px; background: #151517; color: inherit; border: 1px solid #39393f; border-radius: 8px; padding: 10px; font: inherit; resize: vertical; }
  button, select, .file-button { min-height: 44px; background: #1d1d20; color: inherit; border: 1px solid #414148; border-radius: 8px; padding: 9px 14px; font: inherit; }
  button.primary { background: #315ee8; border-color: #315ee8; }
  main { --stage-height: 100vh; position: relative; height: var(--stage-height); min-height: 540px; overflow: hidden; isolation: isolate; display: grid; grid: "ledger ledger-grip stage display-grip display" minmax(0, 1fr) / var(--ledger-col) var(--grip) minmax(0, 1fr) var(--grip) var(--display-col); padding: var(--pad); background: radial-gradient(ellipse at 50% 34%, #51443d 0, #29252a 40%, #111219 72%); }
  .control { grid-area: stage; position: relative; min-width: 0; min-height: 0; --canvas-height: calc(100% - var(--status) - var(--desk)); }
  #puppet { position: absolute; z-index: 2; left: calc(-1 * var(--wing)); top: var(--status); width: calc(100% + 2 * var(--wing)); height: var(--canvas-height); touch-action: manipulation; cursor: pointer; }
  #puppet-prompt { position: absolute; z-index: 3; top: 35%; left: 0; width: 100%; text-align: center; pointer-events: none; }
  #puppet-credit { position: absolute; z-index: 3; left: 0; right: 0; top: calc(var(--status) + var(--canvas-height) + 4px); min-height: 18px; color: #cfc4b6; text-align: center; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .display, .ledger { position: relative; z-index: 3; min-width: 0; min-height: 0; padding: 18px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(145deg, #201e22ee, #111217ee); border: 1px solid #6d5c49; border-radius: 4px; box-shadow: 0 18px 42px #0008, inset 0 0 35px #8a684111; }
  .display { grid-area: display; }
  .ledger { grid-area: ledger; }
  .display.full, .ledger.full { position: fixed; inset: var(--pad); z-index: 20; background: #16151a; }
  .display.full { left: calc(var(--pad) + var(--grip)); } .ledger.full { right: calc(var(--pad) + var(--grip)); }
  .grip.full { position: fixed; z-index: 21; top: var(--pad); bottom: var(--pad); width: var(--grip); }
  .grip.full[data-pane="display"] { left: var(--pad); } .grip.full[data-pane="ledger"] { right: var(--pad); }
  body:has(.full) header { visibility: hidden; }
  .display h2, .ledger h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #a5a5aa; }
  .grip { position: relative; z-index: 5; display: flex; align-items: center; justify-content: center; cursor: col-resize; touch-action: none; user-select: none; outline: none; }
  .grip[data-pane="ledger"] { grid-area: ledger-grip; } .grip[data-pane="display"] { grid-area: display-grip; }
  .grip::before { content: ''; position: absolute; top: 12%; bottom: 12%; left: 50%; width: 1px; background: linear-gradient(transparent, #6d5c4999, transparent); }
  .grip::after { content: ''; position: relative; width: 8px; height: 52px; border-radius: 4px; background: #2a2622 radial-gradient(circle, #cdb89c 1.4px, transparent 1.8px) center / 8px 9px repeat-y; border: 1px solid #6d5c49; transition: height .15s, background-color .15s; }
  .grip:hover::after, .grip:focus-visible::after, .grip.dragging::after { height: 84px; background-color: #4a3f33; border-color: #cdb89c; }
  #display-items, #log { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: auto; }
  .display-item { padding: 13px; background: #1b1b1e; border-radius: 8px; overflow-wrap: anywhere; }
  .display-item > :first-child { margin-top: 0; } .display-item > :last-child { margin-bottom: 0; }
  .display-item img { display: block; width: 100%; height: auto; max-height: 52dvh; object-fit: contain; margin-top: 10px; border-radius: 6px; background: #0b0b0c; }
  .display-item a { color: #8eabff; }
  .display-item .mermaid svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .display-item .chart { position: relative; height: 220px; }
  .display-item .math-block, .display-item .mermaid { overflow-x: auto; }
  .display-item pre { overflow-x: auto; }
  .turn, .usage { padding: 11px 12px; background: #1b1b1e; border-radius: 8px; overflow-wrap: anywhere; }
  .tag { color: #8eabff; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .tag.alone { color: #d4ae68; }
  .line { margin-top: 5px; } .key { color: #8f8f96; }
  .dock { position: fixed; z-index: 10; bottom: calc(var(--pad) + 14px); left: calc(var(--pad) + var(--ledger-col) + var(--grip)); right: calc(var(--pad) + var(--display-col) + var(--grip)); display: flex; justify-content: center; pointer-events: none; }
  #controls { pointer-events: auto; display: flex; flex-direction: column; background: #171619; border: 1px solid #51493f; border-radius: 16px; box-shadow: 0 12px 34px #000a; }
  .card-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px; }
  #mic-mute { min-width: 120px; min-height: 52px; border-radius: 26px; font-size: 16px; }
  #mic-mute[aria-pressed="true"] { background: #8c2f39; border-color: #d7626e; }
  #card-toggle { width: 52px; min-height: 52px; padding: 0; border-radius: 26px; display: grid; place-items: center; }
  #card-toggle::before { content: ''; width: 11px; height: 11px; border: solid #f4eee5; border-width: 2px 0 0 2px; transform: translateY(3px) rotate(45deg); }
  #controls.open #card-toggle::before { transform: translateY(-3px) rotate(225deg); }
  .card-body { display: none; }
  #controls.open .card-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(660px, 100vw - 32px); max-height: calc(100svh - 130px); overflow: auto; padding: 16px 16px 4px; }
  .group { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 14px; border: 1px solid #39393f; border-radius: 12px; min-width: 0; }
  .group.wide { grid-column: 1 / -1; }
  .group h3 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #a5a5aa; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1 1 auto; }
  #voice-filter[aria-pressed="false"] { color: #a5a5aa; border-style: dashed; }
  #puppet-choice { width: 100%; }
  #share-file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file-button { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  #share-image { color: #bdbdc3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 120px; }
  #share-target { border: 1px dashed #414148; border-radius: 8px; padding: 10px; text-align: center; color: #a5a5aa; }
  #share-target.over { border-color: #8eabff; color: #ececed; }
  .saved-note { color: #a5a5aa; }
  @media (max-height: 540px) {
    :root { --pad: 8px; --desk: 96px; --status: 24px; }
    main { min-height: 0; }
    header { top: calc(var(--pad) + 2px); height: 20px; font-size: 13px; }
    #elapsed { font-size: 15px; }
    .display, .ledger { padding: 10px; }
    .dock { bottom: calc(var(--pad) + 4px); }
    #controls.open .card-body { max-height: calc(100svh - 90px); }
  }
  @media (max-width: 720px) and (orientation: portrait) {
    :root { --pad: 8px; --grip: 22px; --desk: 30px; --status: 0px; --wing: var(--pad); --display-row: clamp(80px, var(--display-h), calc(100svh - 364px)); --ledger-row: clamp(80px, var(--ledger-h), calc(100svh - 284px - var(--display-row))); }
    body { height: 100svh; min-height: 0; display: flex; flex-direction: column; }
    header { position: static; flex: none; height: 28px; padding: 6px 12px 0; font-size: 13px; }
    #elapsed { font-size: 15px; }
    main { min-height: 0; flex: 1; grid: "stage" minmax(120px, 1fr) "display-grip" var(--grip) "display" var(--display-row) "ledger-grip" var(--grip) "ledger" var(--ledger-row) "dock" 76px / minmax(0, 1fr); }
    #puppet-credit { top: auto; bottom: 0; font-size: 10px; }
    .grip { cursor: row-resize; }
    .display.full, .ledger.full { inset: calc(var(--pad) + var(--grip)) var(--pad) var(--pad); }
    .grip.full { inset: var(--pad) var(--pad) auto; width: auto; height: var(--grip); }
    .grip::before { top: 50%; bottom: auto; left: 10%; right: 10%; width: auto; height: 1px; background: linear-gradient(90deg, transparent, #6d5c4999, transparent); }
    .grip::after { width: 64px; height: 10px; background-size: 9px 10px; background-repeat: repeat-x; }
    .grip:hover::after, .grip:focus-visible::after, .grip.dragging::after { width: 96px; height: 10px; }
    .display, .ledger { padding: 10px; }
    .dock { left: 0; right: 0; bottom: 10px; padding: 0 8px; }
    #controls.open { width: 100%; }
    #controls.open .card-body { grid-template-columns: minmax(0, 1fr); width: 100%; max-height: calc(100svh - 110px); padding: 12px 10px 4px; }
  }
</style>
</head>
<body>
<header><span id="status">paste token to connect</span><span id="elapsed" aria-live="polite">00:00</span></header>
<main id="conversation" class="hidden">
  <section class="control">
    <canvas id="puppet" role="button" tabindex="0" aria-pressed="false" aria-label="start conversation" aria-disabled="true"></canvas>
    <div id="puppet-prompt" aria-hidden="true">Tap to talk</div>
    <div id="puppet-credit"></div>
  </section>
  <section id="ledger" class="ledger"><h2>delegation log</h2><div id="log" aria-live="polite"></div></section>
  <div class="grip" data-pane="ledger" role="separator" aria-orientation="vertical" aria-label="resize delegation log" tabindex="0"></div>
  <div class="grip" data-pane="display" role="separator" aria-orientation="vertical" aria-label="resize hub display" tabindex="0"></div>
  <section id="display" class="display" aria-label="hub display"><h2>from the hub</h2><div id="display-items" aria-live="polite"></div></section>
</main>
<div class="dock">
  <section id="controls" aria-label="controls">
    <div class="card-body" id="card-body">
      <section class="group" aria-label="microphone"><h3>Microphone</h3><button id="voice-filter" type="button" aria-pressed="true">Voice ID on</button><button id="voice-print" type="button">Learn my voice</button></section>
      <section class="group" aria-label="appearance"><h3>Appearance</h3><select id="puppet-choice" aria-label="puppet appearance"></select></section>
      <section class="group" aria-label="conversation"><h3>Conversation</h3><button id="reset" type="button">Reset</button></section>
      <section class="group wide" aria-label="send text or image"><h3>Send to the hub</h3>
        <textarea id="share-text" maxlength="8192" placeholder="Paste text, a URL, or an image"></textarea>
        <div id="share-target">Drop or paste an image here</div>
        <div class="row"><label class="file-button" for="share-file">Choose image</label><input id="share-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" capture="environment"><button id="share-remove" class="hidden">Remove image</button><span id="share-image">No image selected</span><button id="share-send" class="primary">Send</button></div>
      </section>
      <section id="token-panel" class="group wide" aria-label="device"><h3>Device</h3>
        <div id="entry" class="row"><textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false"></textarea><button id="connect" class="primary">Connect</button></div>
        <div id="saved" class="row hidden"><span class="saved-note">🔒 device authenticated</span><button id="reenter">Use another token</button><button id="forget">Forget token</button></div>
      </section>
    </div>
    <div class="card-bar"><button id="mic-mute" type="button" aria-pressed="false" disabled>Mute mic</button><button id="card-toggle" type="button" aria-label="all controls" aria-controls="card-body" aria-expanded="false"></button></div>
  </section>
</div>
<audio id="speaker" autoplay></audio>
<script type="module" src="main.js"></script>
</body>
</html>
