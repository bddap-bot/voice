  if (epoch !== puppetEpoch) throw new Error('puppet catalog replaced');
  $('puppet-choice').replaceChildren(...puppetCatalog.avatars.map((avatar) => {
    const option = document.createElement('option');
    option.value = avatar.id;
    option.textContent = avatar.file;
    return option;
  }));
  $('puppet-choice').value = puppetActive ?? puppetCatalog.active;
  if (puppetActive !== puppetCatalog.active && !puppetLoading) await showPuppet(puppetCatalog.active);
}

$('puppet').addEventListener('click', toggleConversation);
$('reset').addEventListener('click', () => {
  stopConversation();
  interruptHubReplies('reset');
  paintOff();
  trace = new ConversationTrace(render);
  render(trace.entries);
  sendFrame('forget').catch((error) => setStatus(`reset incomplete: ${error.message}`, 'err'));
});
$('puppet').addEventListener('keydown', (event) => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  toggleConversation();
});
$('share-file').addEventListener('change', () => { try { chooseImage($('share-file').files[0]); } catch (error) { chooseImage(); setStatus(error.message, 'err'); } });
$('share-remove').addEventListener('click', () => { $('share-file').value = ''; chooseImage(); });
$('share-text').addEventListener('paste', (event) => {
  const image = [...event.clipboardData.files].find((file) => file.type.startsWith('image/'));
  if (image) try { chooseImage(image); } catch (error) { setStatus(error.message, 'err'); }
});
for (const name of ['dragenter', 'dragover']) $('share-target').addEventListener(name, (event) => { event.preventDefault(); $('share-target').classList.add('over'); });
for (const name of ['dragleave', 'drop']) $('share-target').addEventListener(name, (event) => { event.preventDefault(); $('share-target').classList.remove('over'); });
$('share-target').addEventListener('drop', (event) => { try { chooseImage([...event.dataTransfer.files].find((file) => file.type.startsWith('image/'))); } catch (error) { setStatus(error.message, 'err'); } });
$('share-send').addEventListener('click', () => submitShare().catch((error) => setStatus(error.message, 'err')));
$('puppet-choice').addEventListener('change', () => showPuppet($('puppet-choice').value).catch((error) => {
  if (error.message === 'puppet load replaced') return;
  if (puppetActive) $('puppet-choice').value = puppetActive;
  reportPuppetError(error);
}));
$('connect').addEventListener('click', () => start($('token').value).catch((error) => setStatus(error.message, 'err')));
$('card-toggle').addEventListener('click', () => setCard(!$('controls').classList.contains('open')));
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  if ($('controls').classList.contains('open') && $('entry').classList.contains('hidden')) setCard(false);
  else if (fullPane) leaveFull();
});
$('mic-mute').addEventListener('click', () => setMicrophoneMuted(!microphoneMuted));
$('voice-print').addEventListener('click', toggleVoiceprint);
$('voice-filter').addEventListener('click', toggleVoiceFilter);
syncVoiceprint();
prepareVoice();
$('reenter').addEventListener('click', async () => { listening = false; setMicrophoneMuted(microphoneMuted); stopConversation(); await recorderFlush; setStatus('finishing private uploads…'); await persistenceUploads.idle(); await telemetry.idle(); savedState(false); $('token').focus(); });
$('forget').addEventListener('click', async () => { listening = false; setMicrophoneMuted(microphoneMuted); stopConversation(); await recorderFlush; stopLearning(); localStorage.removeItem(KEY); localStorage.removeItem(VOICEPRINT); syncVoiceprint(); setStatus('finishing private uploads…'); await persistenceUploads.idle(); await telemetry.idle(); await sendFrame('bye').catch(() => {}); generation++; connected = false; resetPuppetConnection(new Error('connection replaced'), true); await puppetChannel.clearCache().catch(() => {}); savedState(false); setStatus('token forgotten'); });
navigator.mediaDevices?.addEventListener('devicechange', syncSpotter);
document.addEventListener('visibilitychange', () => { syncScreenLock(); keepPage(); if (document.hidden) puppetRuntime?.pause(); else if (!$('conversation').classList.contains('hidden')) puppetRuntime?.start(); });
window.addEventListener('beforeunload', () => puppetRuntime?.dispose());
const saved = configuredToken(config, localStorage.getItem(KEY));
if (saved) { setCard(false); start(saved).then(() => {
  if (!restored) return;
  recordSession('restore', JSON.stringify({ discarded: Boolean(document.wasDiscarded), awake: restored.awake, away_ms: Date.now() - restored.at }), null);
  if (restored.awake && Date.now() - restored.at < INACTIVITY_MS) toggleConversation();
}, (error) => { localStorage.removeItem(KEY); savedState(false); setStatus(error.message, 'err'); }); }
if (config.serviceWorker && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
