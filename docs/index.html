<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="img-src 'self'; media-src blob:;">
<title>voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: #0b0b0c; color: #ececed; font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: baseline; padding: 16px clamp(16px, 4vw, 36px); border-bottom: 1px solid #26262a; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .05em; }
  #status { color: #a5a5aa; } #status.err { color: #ff8585; } #status.ok { color: #75dc8b; }
  .hidden { display: none !important; }
  .entry, .saved { padding: 18px clamp(16px, 4vw, 36px); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea { flex: 1 1 440px; min-height: 72px; background: #151517; color: inherit; border: 1px solid #39393f; border-radius: 8px; padding: 10px; }
  button { background: #1d1d20; color: inherit; border: 1px solid #414148; border-radius: 8px; padding: 9px 14px; font: inherit; }
  button.primary { background: #315ee8; border-color: #315ee8; }
  main { display: grid; grid-template-columns: minmax(240px, .7fr) minmax(360px, 1.5fr); gap: 18px; padding: clamp(16px, 4vw, 36px); }
  .control, .ledger { background: #141416; border: 1px solid #2d2d31; border-radius: 14px; }
  .control { min-height: 260px; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 28px; }
  #toggle { width: min(62vw, 230px); height: 112px; border-radius: 58px; font-size: 22px; font-weight: 650; touch-action: manipulation; }
  #toggle.on { background: #1f7642; border-color: #50c878; }
  #elapsed { font: 28px/1 ui-monospace, monospace; color: #bdbdc3; min-height: 28px; }
  .ledger { min-height: 260px; padding: 18px; overflow: hidden; }
  .ledger h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #a5a5aa; }
  #log { display: flex; flex-direction: column-reverse; gap: 10px; max-height: 65dvh; overflow: auto; }
  .turn, .usage { padding: 11px 12px; background: #1b1b1e; border-radius: 8px; overflow-wrap: anywhere; }
  .tag { color: #8eabff; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .tag.alone { color: #d4ae68; }
  .line { margin-top: 5px; } .key { color: #8f8f96; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } .control { min-height: 220px; } #log { max-height: none; } }
</style>
</head>
<body>
<header><h1>voice</h1><span id="status">paste token to connect</span></header>
<section id="entry" class="entry">
  <textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false"></textarea>
  <button id="connect" class="primary">Connect</button>
</section>
<section id="saved" class="saved hidden">
  <span>🔒 device authenticated</span><button id="reenter">Use another token</button><button id="forget">Forget token</button>
</section>
<main id="conversation" class="hidden">
  <section class="control">
    <button id="toggle" aria-pressed="false">conversation off</button>
    <div id="elapsed" aria-live="polite">00:00 / 30:00</div>
  </section>
  <section class="ledger"><h2>live delegation log</h2><div id="log" aria-live="polite"></div></section>
</main>
<audio id="speaker" autoplay></audio>
<script type="module">
import wbgInit, { init as wasmInit, connect, send_only, recv } from 'https://bddap-bot.github.io/botq/botq_dash_wasm.js';
import { ConversationTrace, SessionClock, formatElapsed } from './live.js';

const KEY = 'voice.token';
const ALPN = 'voice-web/1';
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let token;
let wasm;
let generation = 0;
let listener;
let sendQueue = Promise.resolve();
let answerWaiter;
let conversation;
let usageSeconds = 0;
let connected = false;

function setStatus(text, kind = '') { $('status').textContent = text; $('status').className = kind; }
function savedState(saved) { $('entry').classList.toggle('hidden', saved); $('saved').classList.toggle('hidden', !saved); $('conversation').classList.toggle('hidden', !saved); }
function decodeToken(raw) {
  let value = raw.trim().replace(/-/g, '+').replace(/_/g, '/');
  while (value.length % 4) value += '=';
  return JSON.parse(dec.decode(Uint8Array.from(atob(value), (char) => char.charCodeAt(0))));
}
function sendFrame(value) {
  const mine = generation;
  const next = sendQueue.then(() => mine === generation ? send_only(enc.encode(value)) : Promise.reject(new Error('connection replaced')));
  sendQueue = next.catch(() => {});
  return next;
}
function render(entries) {
  $('log').replaceChildren(...entries.map((entry) => {
    const node = document.createElement('article');
    node.className = 'turn';
    const tag = document.createElement('div');
    const name = entry.kind === 'heard' ? 'model heard' : entry.kind === 'spoken' ? entry.source : 'delegated';
    tag.className = `tag${name === 'model alone' ? ' alone' : ''}`;
    tag.textContent = name;
    node.append(tag);
    const lines = entry.kind === 'heard' ? [['heard', entry.text]]
      : entry.kind === 'spoken' ? [['said', entry.text]]
      : [['sent to hub', entry.sent], ['context sent', JSON.stringify(entry.context)], ['hub reply', entry.reply || 'waiting…'], ['hub timing', entry.timing === null ? 'waiting…' : `${entry.timing} ms`]];
    for (const [key, value] of lines) {
      const line = document.createElement('div');
      line.className = 'line';
      const label = document.createElement('span');
      label.className = 'key';
      label.textContent = `${key}: `;
      line.append(label, document.createTextNode(value));
      node.append(line);
    }
    return node;
  }));
}
let trace = new ConversationTrace(render);

async function listen(mine) {
  try {
    for (;;) {
      const raw = await recv();
      if (mine !== generation) return;
      const value = dec.decode(raw);
      const at = value.indexOf('\n');
      const verb = at < 0 ? value : value.slice(0, at);
      const body = at < 0 ? '' : value.slice(at + 1);
      if (verb === 'answer') answerWaiter?.resolve(JSON.parse(body));
      else if (verb === 'hub') await receiveHub(JSON.parse(body));
      else if (verb === 'hub-error') await receiveHubError(JSON.parse(body));
      else if (verb === 'error') {
        answerWaiter?.reject(new Error(body));
        answerWaiter = null;
        setStatus(body, 'err');
      }
    }
  } catch (error) {
    if (mine !== generation) return;
    answerWaiter?.reject(error);
    answerWaiter = null;
    connected = false;
    if (conversation) await stopConversation('connection lost');
    else setStatus('connection lost', 'err');
  }
}
async function dial() {
  connected = false;
  generation++;
  await connect(token.relay_url ? `${token.endpoint_id}@${token.relay_url}` : token.endpoint_id, ALPN);
  await sendFrame(JSON.stringify({ auth: token.secret }));
  if (!JSON.parse(dec.decode(await recv())).ok) throw new Error('wrong token');
  connected = true;
  listener = listen(generation);
}
function waitForAnswer() {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      answerWaiter = null;
      reject(new Error('SDP exchange timed out'));
    }, 30000);
    answerWaiter = {
      resolve: (value) => { clearTimeout(timer); resolve(value); },
      reject: (error) => { clearTimeout(timer); reject(error); },
    };
  });
}
function waitIce(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') resolve(); }));
}
function waitData(channel, predicate, timeout = 10000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { channel.removeEventListener('message', onMessage); reject(new Error('Live session timed out')); }, timeout);
    const onMessage = (message) => {
      let event;
      try { event = JSON.parse(message.data); } catch { return; }
      if (!predicate(event)) return;
      clearTimeout(timer);
      channel.removeEventListener('message', onMessage);
      resolve(event);
    };
    channel.addEventListener('message', onMessage);
  });
}
function onLiveEvent(message) {
  let event;
  try { event = JSON.parse(message.data); } catch { return; }
  if (event.type === 'session.input_transcript.delta') trace.heard(event.delta ?? '');
  else if (event.type === 'session.output_transcript.delta') trace.spoke(event.delta ?? '');
  else if (event.type === 'session.output_transcript.done') trace.completeSpeech();
  else if (event.type === 'session.delegation.created') {
    const id = event.delegation?.id;
    if (!id) return setStatus('Live delegation had no id', 'err');
    const turn = trace.delegated(id);
    if (!turn.sent) return setStatus('Live delegated before producing a transcript', 'err');
    sendFrame(`delegate\n${JSON.stringify({ id, text: turn.sent, context: turn.context, duration_ms: turn.duration_ms })}`).catch((error) => setStatus(error.message, 'err'));
  } else if (event.type === 'session.usage.updated') usageSeconds = Number(event.usage?.seconds ?? usageSeconds);
  else if (event.type === 'session.closed') {
    usageSeconds = Number(event.usage?.seconds ?? usageSeconds);
    stopConversation('Live session ended', true);
  }
}
async function receiveHub(result) {
  if (!conversation?.channel || !trace.hub(result.id, result.reply, result.timing_ms)) return;
  conversation.channel.send(JSON.stringify({ type: 'session.commentary.append', event_id: `hub_${result.stamp}`, delegation_id: result.id, content: result.reply }));
  await sendFrame(`hub-ack\n${JSON.stringify({ id: result.id, stamp: result.stamp })}`);
}
async function receiveHubError(result) {
  if (!conversation?.channel || !trace.failed(result.id, result.message)) return;
  conversation.channel.send(JSON.stringify({ type: 'session.commentary.append', event_id: `hub_error_${Date.now()}`, delegation_id: result.id, content: `The hub could not answer this request: ${result.message}. Say that briefly without inventing.` }));
}
async function startConversation() {
  if (!connected) await dial();
  trace = new ConversationTrace(render);
  render([]);
  usageSeconds = 0;
  setStatus('opening microphone…');
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const pc = new RTCPeerConnection();
  const channel = pc.createDataChannel('oai-events');
  const started = waitData(channel, (event) => event.type === 'session.started', 30000);
  channel.addEventListener('message', onLiveEvent);
  pc.ontrack = (event) => { $('speaker').srcObject = event.streams[0]; };
  for (const track of stream.getTracks()) pc.addTrack(track, stream);
  conversation = { pc, channel, stream, clock: null };
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  const answerPromise = waitForAnswer();
  await sendFrame(`offer\n${pc.localDescription.sdp}`);
  const answer = await answerPromise;
  answerWaiter = null;
  await pc.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
  await started;
  const capLabel = formatElapsed(answer.cap_seconds);
  const clock = new SessionClock({ capSeconds: answer.cap_seconds, onTick: (seconds) => { $('elapsed').textContent = `${formatElapsed(seconds)} / ${capLabel}`; }, onCap: () => stopConversation(`${Math.round(answer.cap_seconds / 60)} minute cap reached — conversation stopped`) });
  conversation.clock = clock;
  clock.start();
  $('toggle').classList.add('on');
  $('toggle').setAttribute('aria-pressed', 'true');
  $('toggle').textContent = 'conversation on';
  setStatus('live', 'ok');
}
async function stopConversation(reason = 'conversation off', remoteClosed = false) {
  const current = conversation;
  if (!current) return;
  conversation = null;
  current.clock?.stop();
  for (const track of current.stream.getTracks()) track.stop();
  trace.cancel();
  $('toggle').classList.remove('on');
  $('toggle').setAttribute('aria-pressed', 'false');
  $('toggle').textContent = 'conversation off';
  $('elapsed').textContent = '00:00 / 30:00';
  sendFrame('cancel').catch(() => {});
  if (!remoteClosed && current.channel.readyState === 'open') {
    const closed = waitData(current.channel, (event) => event.type === 'session.closed', 5000).catch(() => null);
    current.channel.send(JSON.stringify({ type: 'session.close' }));
    const final = await closed;
    usageSeconds = Number(final?.usage?.seconds ?? usageSeconds);
  }
  current.channel.close();
  current.pc.close();
  $('speaker').srcObject = null;
  const cost = usageSeconds * 0.05 / 60;
  const item = document.createElement('div');
  item.className = 'usage';
  item.textContent = `session: ${usageSeconds.toFixed(1)} s · estimated $${cost.toFixed(4)} at $0.05/min`;
  $('log').prepend(item);
  setStatus(reason, reason === 'conversation off' ? 'ok' : 'err');
}
async function toggleConversation() {
  $('toggle').disabled = true;
  try {
    if (conversation) await stopConversation();
    else await startConversation();
  } catch (error) {
    if (conversation) await stopConversation('conversation could not start');
    console.warn('voice:', error);
    setStatus(`conversation could not start: ${error.message}`, 'err');
  } finally { $('toggle').disabled = false; }
}
async function start(raw) {
  setStatus('decoding token…');
  try { token = decodeToken(raw); } catch { return setStatus('that does not look like a token', 'err'); }
  if (!token.endpoint_id || !token.secret) return setStatus('that token is missing pieces', 'err');
  setStatus('loading…');
  wasm ??= wbgInit().then(() => wasmInit());
  await wasm;
  await dial();
  localStorage.setItem(KEY, raw.trim());
  $('token').value = '';
  savedState(true);
  setStatus('ready', 'ok');
}

$('toggle').addEventListener('click', toggleConversation);
$('connect').addEventListener('click', () => start($('token').value).catch((error) => setStatus(error.message, 'err')));
$('reenter').addEventListener('click', async () => { await stopConversation(); savedState(false); $('token').focus(); });
$('forget').addEventListener('click', async () => { await stopConversation(); localStorage.removeItem(KEY); await sendFrame('bye').catch(() => {}); generation++; connected = false; savedState(false); setStatus('token forgotten'); });
const saved = localStorage.getItem(KEY);
if (saved) start(saved).catch((error) => { localStorage.removeItem(KEY); savedState(false); setStatus(error.message, 'err'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
