<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="img-src 'self'; media-src blob:;">
<title>voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0c; color: #e6e6e6; font: 16px/1.4 system-ui, sans-serif;
         min-height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: #9a9a9a; font-size: 14px; }
  #status.err { color: #ff6b6b; } #status.ok { color: #6bd47a; }
  .row { display: flex; gap: 8px; padding: 8px 16px; align-items: center; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 80px; background: #151517; color: inherit; border: 1px solid #333; border-radius: 6px; padding: 8px; }
  button { background: #1d1d20; color: inherit; border: 1px solid #3a3a3f; border-radius: 6px; padding: 8px 14px; font: inherit; }
  button.primary { background: #2c5cff; border-color: #2c5cff; }
  .hidden { display: none !important; }
  #talk { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #hold { width: min(70vw, 320px); height: min(70vw, 320px); border-radius: 50%; font-size: 24px;
          background: #1d1d20; border: 3px solid #3a3a3f; touch-action: none; user-select: none; -webkit-user-select: none; }
  #hold.on { background: #b3261e; border-color: #ff6b6b; }
  #hold.nudge { animation: nudge 1s ease-in-out infinite alternate; }
  @keyframes nudge { from { border-color: #3a3a3f; } to { border-color: #ff6b6b; box-shadow: 0 0 24px #ff6b6b; } }
  #live.on { background: #1f6f3f; border-color: #6bd47a; }
  #log { padding: 0 16px 16px; font-size: 15px; white-space: pre-wrap; }
  #log .me { color: #9fb7ff; } #log .hub { color: #e6e6e6; }
</style>
</head>
<body>
<header>
  <h1>voice</h1>
  <span id="status">paste token to connect</span>
</header>

<div id="entry">
  <div class="row">
    <textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false" inputmode="text"></textarea>
  </div>
  <div class="row">
    <button id="connect" class="primary">Connect</button>
  </div>
</div>

<div id="saved" class="row hidden">
  <span>🔒 token saved on this device</span>
  <button id="reenter">Use a different token</button>
  <button id="forget">Forget token</button>
</div>

<div id="talk" class="hidden">
  <button id="hold">hold to talk</button>
</div>
<div id="modes" class="row hidden">
  <button id="live">Live call</button>
</div>
<div id="log"></div>

<script type="module">
import wbgInit, { init as wasmInit, connect, send_only, recv } from 'https://bddap-bot.github.io/botq/botq_dash_wasm.js';
import { createPtt, wavSink, trackSink, createNudge } from './ptt.js';

const KEY = 'voice.token';
const ALPN = 'voice-web/1';
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const msg = (e) => (e && e.message ? e.message : String(e));

function setStatus(text, cls = '') { $('status').textContent = text; $('status').className = cls; }
function showSavedState(saved) { $('entry').classList.toggle('hidden', saved); $('saved').classList.toggle('hidden', !saved); }
function say(cls, text) {
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  $('log').prepend(d);
}
function b64urlToText(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return dec.decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
}

let token = null;
let gen = 0;
let listener = null;
let live = null;
let dialing = false;
let lastError = null;
let liveSeq = 0;
const blocked = new Map();
const played = new Set();
let audioCtx = null;
const ctx = () => {
  audioCtx ??= new AudioContext();
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  return audioCtx;
};

let queue = Promise.resolve();
const sendFrame = (f) => {
  const bytes = typeof f === 'string' ? enc.encode(f) : f;
  const g = gen;
  const p = queue.then(() => (g === gen ? send_only(bytes) : Promise.reject(new Error('stream replaced'))));
  queue = p.catch(() => {});
  return p;
};

async function hangUp() {
  const old = listener;
  if (!old) return;
  gen++;
  const settled = Promise.race([old.then(() => true), sleep(5000).then(() => false)]);
  await Promise.race([sendFrame('bye').catch(() => {}), sleep(5000)]);
  if (!await settled) throw new Error('the old stream is stuck; reload the page');
  listener = null;
}

async function dial(liveMode) {
  await hangUp();
  await connect(token.relay_url ? `${token.endpoint_id}@${token.relay_url}` : token.endpoint_id, ALPN);
  await sendFrame(JSON.stringify({ auth: token.secret, live: liveMode }));
  if (!JSON.parse(dec.decode(await recv())).ok) throw new Error('auth rejected — wrong secret');
  const my = ++gen;
  listener = listen(my);
  return my;
}

async function listen(my) {
  try {
    for (;;) {
      const f = await recv();
      if (my !== gen) return;
      const nl = f.indexOf(10);
      const head = dec.decode(nl < 0 ? f : f.subarray(0, nl));
      const body = nl < 0 ? new Uint8Array() : f.subarray(nl + 1);
      const [verb, ...args] = head.split(' ');
      if (verb === 'reply') onReply(args, body);
      else if (verb === 'sent') { setStatus('sent', 'ok'); say('me', `🎙 sent ${(Number(args[0]) / 32000).toFixed(1)}s`); }
      else if (verb === 'answer') await live?.pc.setRemoteDescription({ type: 'answer', sdp: dec.decode(body) });
      else if (verb === 'status') setStatus(`live: ${dec.decode(body)}`, 'ok');
      else if (verb === 'you') say('me', `🎙 ${dec.decode(body)}`);
      else if (verb === 'error') { lastError = dec.decode(body); setStatus(live || dialing ? `live: ${lastError}` : lastError, 'err'); }
    }
  } catch (e) {
    if (my !== gen) return;
    const why = lastError ?? msg(e);
    lastError = null;
    if (live || dialing) { liveStop(why); return; }
    setStatus(`connection lost: ${why} — reconnecting…`, 'err');
    await sleep(3000);
    if (my === gen) session();
  }
}

function onReply([stamp, t, w], body) {
  const tlen = Number(t), wlen = Number(w);
  if (!stamp || body.length !== tlen + wlen) return setStatus(`bad reply frame ${stamp ?? ''}`, 'err');
  if (blocked.has(stamp) || played.has(stamp)) return;
  const url = URL.createObjectURL(new Blob([body.subarray(tlen)], { type: 'audio/wav' }));
  const audio = new Audio(url);
  const text = dec.decode(body.subarray(0, tlen));
  const ack = () => { played.add(stamp); sendFrame(`ack\n${stamp}`).catch(() => {}); say('hub', text); };
  const ended = new Promise((r) => { audio.onended = r; audio.onerror = r; setTimeout(r, 120000); }).then(() => URL.revokeObjectURL(url));
  const entry = { audio, ack, ended };
  audio.play().then(() => { ack(); live?.report('reply playing'); }).catch((e) => {
    if (e?.name === 'NotAllowedError') { blocked.set(stamp, entry); setStatus('tap to enable audio', 'err'); }
    else { ack(); setStatus(`reply failed to play: ${msg(e)}`, 'err'); }
  });
}
document.addEventListener('pointerdown', () => {
  const queued = [...blocked.values()];
  blocked.clear();
  const chain = (i) => {
    if (i >= queued.length) return;
    const { audio, ack, ended } = queued[i];
    audio.play().then(() => { ack(); return ended; }, (e) => { ack(); setStatus(`reply failed to play: ${msg(e)}`, 'err'); }).then(() => chain(i + 1));
  };
  chain(0);
}, true);

async function session() {
  setStatus('connecting over iroh…');
  for (;;) {
    try { await dial(false); break; }
    catch (e) { setStatus(`connect failed: ${msg(e)} — retrying…`, 'err'); await sleep(3000); }
  }
  setStatus('connected — hold the button to talk', 'ok');
}

function capture(stream) {
  const c = ctx();
  const src = c.createMediaStreamSource(stream);
  const proc = c.createScriptProcessor(4096, 1, 1);
  let cb = () => {};
  proc.onaudioprocess = (e) => cb(e.inputBuffer.getChannelData(0).slice());
  src.connect(proc); proc.connect(c.destination);
  return { rate: c.sampleRate, onChunk: (f) => { cb = f; }, close: () => { proc.disconnect(); src.disconnect(); } };
}
async function upload(wav) {
  const frame = new Uint8Array(6 + wav.length);
  frame.set(enc.encode('utter\n')); frame.set(wav, 6);
  await sendFrame(frame);
}
const level = (s) => (/fail|refused/.test(s) ? 'err' : '');
const onState = (s) => (live ? live.report(s, level(s) || 'ok') : setStatus(s, level(s)));
const wav = wavSink({ capture, upload, onState });
const ptt = createPtt({ mediaDevices: navigator.mediaDevices, sink: () => (live ? live.sink : wav), onState });
const hold = $('hold');
const down = (e) => {
  e.preventDefault();
  if (dialing || stopping) return;
  ctx();
  live?.nudge.hold();
  hold.classList.add('on');
  ptt.hold().catch((err) => setStatus(`hold failed: ${msg(err)}`, 'err'));
};
const up = (e) => { e.preventDefault(); hold.classList.remove('on'); ptt.release().catch((err) => setStatus(`release failed: ${msg(err)}`, 'err')); };
hold.addEventListener('pointerdown', down);
hold.addEventListener('pointerup', up);
hold.addEventListener('pointercancel', up);
hold.addEventListener('pointerleave', (e) => { if (ptt.held) up(e); });
hold.addEventListener('contextmenu', (e) => e.preventDefault());

let wasm = null;
async function start(raw) {
  setStatus('decoding token…');
  let t;
  try { t = JSON.parse(b64urlToText(raw.trim())); }
  catch { return setStatus('token is not valid base64url JSON', 'err'); }
  if (!t.endpoint_id || !t.secret) return setStatus('token missing endpoint_id/secret', 'err');
  token = t;
  setStatus('loading wasm…');
  wasm ??= wbgInit().then(() => wasmInit());
  await wasm;
  localStorage.setItem(KEY, raw.trim());
  $('token').value = '';
  showSavedState(true);
  $('talk').classList.remove('hidden');
  $('modes').classList.remove('hidden');
  await session();
}

function silenceTrack() {
  const c = ctx();
  const src = c.createConstantSource(); src.offset.value = 0;
  const dst = c.createMediaStreamDestination(); src.connect(dst); src.start();
  return { track: dst.stream.getAudioTracks()[0], close: () => { src.stop(); src.disconnect(); } };
}
function makeMeter(stream) {
  const c = ctx();
  const analyser = c.createAnalyser();
  analyser.fftSize = 1024;
  const source = c.createMediaStreamSource(stream);
  source.connect(analyser);
  const values = new Float32Array(analyser.fftSize);
  let peak = 0;
  const sample = () => {
    analyser.getFloatTimeDomainData(values);
    let sum = 0;
    for (const value of values) sum += value * value;
    peak = Math.max(peak, Math.sqrt(sum / values.length));
  };
  const timer = setInterval(sample, 100);
  sample();
  return { read: () => { sample(); return peak; }, close: () => { clearInterval(timer); source.disconnect(); analyser.disconnect(); } };
}
function candidates(sdp) {
  const local = {};
  for (const l of sdp.match(/^a=candidate:.*/gm) ?? []) {
    const [, proto, addr, typ] = /^a=candidate:\S+ \d+ (\S+) \d+ (\S+) \d+ typ (\S+)/.exec(l) ?? [];
    const kind = proto ? `${proto.toLowerCase()}${addr.includes(':') ? '6' : /^\d+(\.\d+){3}$/.test(addr) ? '4' : ''} ${typ}` : 'unparsed';
    local[kind] = (local[kind] ?? 0) + 1;
  }
  return Object.entries(local).map(([k, n]) => `${k}×${n}`).join(' ') || 'no candidates';
}
const gathered = (pc) => new Promise((r) => {
  if (pc.iceGatheringState === 'complete') return r();
  const t = setTimeout(r, 2000);
  pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } };
});

async function liveStart() {
  const seq = ++liveSeq;
  dialing = true;
  $('live').classList.add('on');
  setStatus('live: reconnecting…');
  const report = (s, cls = 'ok') => { s = String(s).slice(0, 190); setStatus(`live: ${s}`, cls); sendFrame(`state\n${s}`).catch(() => {}); };
  try {
    await ptt.release();
    const my = await dial(true);
    if (!dialing) return;
    const pc = new RTCPeerConnection();
    const silence = silenceTrack();
    const sender = pc.addTrack(silence.track, new MediaStream([silence.track]));
    const nudge = createNudge({ onNudge: () => { report('hold the button to talk', 'err'); hold.classList.add('nudge'); }, onClear: () => hold.classList.remove('nudge') });
    const sink = trackSink({ sender, silence: silence.track, send: sendFrame, makeMeter, onState: (s) => report(s, /refused|failed/.test(s) ? 'err' : 'ok') });
    live = { pc, silence, nudge, report, sink };
    pc.onconnectionstatechange = () => {
      const st = pc.connectionState;
      report(`media ${st}`, st === 'failed' || st === 'disconnected' ? 'err' : 'ok');
      if (st === 'connected') nudge.connected();
      if (st === 'failed') liveStop('media failed');
    };
    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    if (my !== gen || live?.pc !== pc) return;
    await sendFrame(`offer\n${pc.localDescription.sdp}`);
    report(`offer sent, ${candidates(pc.localDescription.sdp)}`);
  } catch (e) { return liveStop(msg(e)); }
  finally { if (seq === liveSeq) dialing = false; }
}
let stopping = null;
function liveStop(why, reconnect = true) {
  stopping ??= (async () => {
    dialing = false;
    const l = live;
    live = null;
    $('live').classList.remove('on');
    await ptt.release().catch(() => {});
    if (l) { l.nudge.stop(); l.pc.close(); l.silence.close(); }
    if (why) { say('hub', `live ended: ${why}`); sendFrame(`bye\n${why}`).catch(() => {}); }
    if (reconnect) await session();
  })().finally(() => { stopping = null; });
  return stopping;
}
$('live').addEventListener('click', () => { if (stopping) return; if (live || dialing) liveStop(); else liveStart(); });

$('connect').addEventListener('click', () => start($('token').value));
$('reenter').addEventListener('click', () => { $('token').value = ''; showSavedState(false); $('token').focus(); });
$('forget').addEventListener('click', async () => {
  localStorage.removeItem(KEY);
  if (live || dialing) await liveStop(undefined, false);
  await hangUp().catch(() => {});
  showSavedState(false);
  $('talk').classList.add('hidden');
  $('modes').classList.add('hidden');
  setStatus('token forgotten');
});

const saved = localStorage.getItem(KEY);
if (saved) { showSavedState(true); start(saved); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
