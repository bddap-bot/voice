function sessionId() { return conversation?.id ?? starting?.offerId ?? null; }
let webGpuAdapterFound = null;
webGpuAdapter().then((adapter) => { webGpuAdapterFound = Boolean(adapter); });

async function sendTelemetry(events) {
  const batchId = crypto.randomUUID();
  const acknowledged = new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      telemetryWaiters.delete(batchId);
      reject(new Error('telemetry acknowledgment timed out'));
    }, 5000);
    telemetryWaiters.set(batchId, {
      resolve: () => { clearTimeout(timer); telemetryWaiters.delete(batchId); resolve(); },
      reject: (error) => { clearTimeout(timer); telemetryWaiters.delete(batchId); reject(error); },
    });
  });
  try {
    await sendFrame(`telemetry\n${JSON.stringify({ batch_id: batchId, events })}`);
  } catch (error) {
    telemetryWaiters.get(batchId)?.reject(error);

function setStatus(text = '', kind = '') { $('status').textContent = text; $('status').title = text; $('status').className = kind; }

}

  if (saved) listenForWake();

}
function syncPuppetUi() {

  const disabled = !puppetReady && !active && !starting;
  $('puppet').setAttribute('aria-disabled', String(disabled));
  $('puppet').setAttribute('aria-pressed', String(active));
  $('puppet').setAttribute('aria-label', active || starting ? 'stop conversation' : 'start conversation');
}
function setMicrophoneMuted(muted) {

try {
  puppetRuntime = new PuppetRuntime($('puppet'), $('display'));

  console.warn('puppet:', error);

function resetPuppetConnection(error = new Error('connection replaced'), clearAppearance = false) {
  puppetEpoch++;

  puppetLoadTail = Promise.resolve();
  puppetLoading = false;
  puppetCatalog = undefined;
  if (clearAppearance) {
    puppetReady = false;
    puppetActive = undefined;

    puppetRuntime?.clear();

function decodeToken(raw) {
  let value = raw.trim().replace(/-/g, '+').replace(/_/g, '/');
  while (value.length % 4) value += '=';
  return JSON.parse(dec.decode(Uint8Array.from(atob(value), (char) => char.charCodeAt(0))));
}
function sendFrame(value) {
  return sendBytes(enc.encode(value));
}
function sendBytes(value) {
  const mine = generation;
  const next = sendQueue.then(() => mine === generation ? send_only(value) : Promise.reject(new Error('connection replaced')));
  sendQueue = next.catch(() => {});
  return next;
}
let logNodes = new WeakMap();
let following = true;
function updateFollowing() {
  following = $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight <= 1;
}
$('log').addEventListener('scroll', updateFollowing);
function render(entries) {
  if (!entries.length) {
    $('log').replaceChildren();
    logNodes = new WeakMap();
    updateFollowing();
    return;
  }
  for (const entry of entries) {
    let record = logNodes.get(entry);
    if (!record) {
    const node = document.createElement('article');
    node.className = 'turn';
    const tag = document.createElement('div');
      const body = document.createElement('div');
    node.append(tag);
      node.append(body);
      $('log').append(node);
      record = { node, tag, body };
      logNodes.set(entry, record);
    }
    const name = entry.kind === 'heard' ? 'model heard' : entry.kind === 'spoken' ? entry.source : 'delegated';
    record.tag.className = `tag${name === 'model alone' ? ' alone' : ''}`;
    record.tag.textContent = name;
    const lines = entry.kind === 'heard' ? [['heard', entry.text]]
      : entry.kind === 'spoken' ? [['spoke', entry.text]]
      : [['sent to hub', entry.sent], ['context sent', JSON.stringify(entry.context)], ['hub reply', entry.reply || 'waiting…'], ['hub timing', entry.timing === null ? 'waiting…' : `${entry.timing} ms`]];
    record.body.replaceChildren(...lines.map(([key, value]) => {
      const line = document.createElement('div');
      line.className = 'line';
      const label = document.createElement('span');
      label.className = 'key';
      label.textContent = `${key}: `;

let trace = new ConversationTrace(render);

async function listen(mine) {
  try {
    for (;;) {
      const raw = await recv();
      if (mine !== generation) return;
      if (await puppetChannel.receive(raw)) continue;
      const value = dec.decode(raw);
      const at = value.indexOf('\n');
      const verb = at < 0 ? value : value.slice(0, at);
      const body = at < 0 ? '' : value.slice(at + 1);
      if (verb === 'display') receiveDisplay(raw);
      else if (verb === 'answer') {
        const answer = JSON.parse(body);
        if (isOfferFor(answerWaiter, answer)) answerWaiter.resolve(answer);
      }
      else if (verb === 'offer-error') {
        const failure = JSON.parse(body);
        if (isOfferFor(answerWaiter, failure)) answerWaiter.reject(new Error(failure.message));
      }
      else if (verb === 'wake-model') wakeModelWaiter?.resolve(JSON.parse(body));
      else if (verb === 'wake-model-none') wakeModelWaiter?.resolve(null);
      else if (verb === 'hub') await receiveHub(JSON.parse(body));
      else if (verb === 'hub-error') receiveHubError(JSON.parse(body));
      else if (verb === 'share-ok') receiveShare(JSON.parse(body));
      else if (verb === 'share-error') receiveShareError(JSON.parse(body));
      else if (verb === 'transcript-ack') {
        const result = JSON.parse(body);
        persistenceUploads.ack(`transcript:${result.session_id}:${result.seq}`);
      }
      else if (verb === 'audio-ack') {
        const result = JSON.parse(body);
        persistenceUploads.ack(`audio:${result.session_id}:${result.side}:${result.seq}`);
      }
      else if (verb === 'telemetry-ack') {
        const result = JSON.parse(body);
        telemetryWaiters.get(result.batch_id)?.resolve();
      }
      else if (verb === 'storage-error') {
        const result = JSON.parse(body);
        const key = result.kind === 'transcript' ? `transcript:${result.session_id}:${result.seq}`
          : result.kind === 'audio' ? `audio:${result.session_id}:${result.side}:${result.seq}` : null;
        if (result.kind === 'telemetry') telemetryWaiters.get(result.batch_id)?.reject(new Error(result.message));

          persistenceUploads.fail(key, result.retryable !== false);
          if (result.retryable === false) recordPageError(new Error(result.message));
        }
      }
      else if (verb === 'error') {
        answerWaiter?.reject(new Error(body));
        answerWaiter = null;
        wakeModelWaiter?.reject(new Error(body));

  } catch (error) {
    if (mine !== generation) return;
    failShares(error);
    answerWaiter?.reject(error);
    answerWaiter = null;
    wakeModelWaiter?.reject(error);

    if (attempt.cancelled) return;
    attempt.offerId = crypto.randomUUID();
    const answerPromise = waitForAnswer(attempt.offerId);
    attempt.offered = true;
    await sendFrame(`offer\n${JSON.stringify({ id: attempt.offerId, sdp: attempt.pc.localDescription.sdp, context: trace.context(true) })}`);
    if (attempt.cancelled) {
      cancelOffer(attempt);
      return;
    }
    const answer = await answerPromise;
    answerWaiter = null;
    if (attempt.cancelled) return;
    await attempt.pc.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
    const { session } = await started;
    if (attempt.cancelled) return;
    awaken(attempt.channel, session);
    conversation = { pc: attempt.pc, channel: attempt.channel, clock: null, id: attempt.offerId, audioOwner: attempt, transcript: new TranscriptBatcher(attempt.offerId, persistenceUploads, { onTurn: (side, at) => telemetry.add({ kind: 'transcript', session_id: attempt.offerId, name: side, at }) }) };
    startRecorders(attempt, attempt.offerId);
    const clock = new SessionClock({ onTick: (seconds) => { $('elapsed').textContent = formatElapsed(seconds); } });
    conversation.clock = clock;
    clock.start();
    puppetRuntime?.pose('listen');
    stayAwake();
    syncPuppetUi();
    setStatus();
    recordSession('open', '', attempt.offerId);
  } catch (error) {
    if (attempt.cancelled) throw new Error('conversation start cancelled');
    recordPageError(error, attempt.offerId ?? null);
    throw error;
  } finally {
    if (conversation?.pc !== attempt.pc) {
      cancelOffer(attempt);
      await stopRecorders(attempt);
      attempt.channel?.close();
      attempt.pc?.close();
      await puppetRuntime?.detachAudio(attempt);
      await attempt.playback?.close();
    }
    if (starting === attempt) starting = null;
  }
}
function stopConversation(reason = '', remoteClosed = false) {
  if (starting) cancelStarting();
  if (stopping) return stopping;
  stopping = finishStop(reason, remoteClosed).finally(() => { stopping = null; });
  return stopping;
}
async function finishStop(reason, remoteClosed) {
  const current = conversation;
  if (!current) return;
  responseTools?.close();
  recordSession('close', reason, current.id);
  await stopRecorders(current.audioOwner);
  current.clock?.stop();
  stageTrace?.sessionEnded();
  stageTrace = null;
  trace.cancel();
  paintOff();
  sendFrame('cancel').catch(() => {});
  if (!remoteClosed && current.channel.readyState === 'open') {
    const closed = waitData(current.channel, (event) => event.type === 'session.closed', 5000).catch(() => null);
    current.channel.send(JSON.stringify({ type: 'session.close' }));
    const final = await closed;
    usageSeconds = Number(final?.usage?.seconds ?? usageSeconds);
  }
  current.transcript.flush();
  conversation = null;
  syncPuppetUi();
  current.channel.close();
  current.pc.close();
  $('speaker').srcObject = null;
  await puppetRuntime?.detachAudio(current.audioOwner);
  await current.audioOwner.playback.close();
  const cost = usageSeconds * 0.05 / 60;
  const item = document.createElement('div');
  item.className = 'usage';
  item.textContent = `session: ${usageSeconds.toFixed(1)} s · estimated $${cost.toFixed(4)} at $0.05/min`;
  $('log').append(item);
  if (following) $('log').scrollTop = $('log').scrollHeight;
  setStatus(reason, reason ? 'err' : '');
}
async function toggleConversation() {
  if ($('puppet').getAttribute('aria-disabled') === 'true') return;
  try {
    if (starting) cancelStarting();
    else if (conversation) await stopConversation();
    else await startConversation();
  } catch (error) {
    if (error.message === 'conversation start cancelled') return;
    if (conversation) await stopConversation('conversation could not start');
    else paintOff();
    console.warn('voice:', error);
    setStatus(`conversation could not start: ${formatStartError(error)}`, 'err');
  }
}
async function start(raw) {
  raw = configuredToken(config, raw);
  setStatus('decoding token…');
  try { token = decodeToken(raw); } catch { return setStatus('that does not look like a token', 'err'); }
  if (!token.endpoint_id || !token.secret) return setStatus('that token is missing pieces', 'err');
  setStatus('loading…');
  wasm ??= wbgInit().then(() => wasmInit());
  await wasm;
  await dial();
  localStorage.setItem(KEY, raw.trim());
  $('token').value = '';
  savedState(true);
  setStatus();
  loadPrivatePuppets().catch((error) => setStatus(`puppet unavailable: ${error.message}`, 'err'));
}

function showPuppet(id, valid = () => true) {
  const epoch = puppetEpoch;
  const request = Symbol('puppet request');
  puppetRequest = request;
  puppetLoading = true;
  $('puppet-choice').disabled = true;
  syncPuppetUi();
  const operation = puppetLoadTail.then(() => loadPuppet(id, epoch, request, valid));
  puppetLoadTail = operation.catch(() => {});
  return operation.finally(() => {
    if (puppetRequest !== request) return;
    puppetLoading = false;
    $('puppet-choice').disabled = false;
    syncPuppetUi();
  });
}

async function loadPuppet(id, epoch, request, valid) {
  const current = () => epoch === puppetEpoch && request === puppetRequest && valid();
  if (!current()) throw new Error('puppet load replaced');
  const avatar = puppetCatalog.avatars.find((item) => item.id === id);
  if (!avatar) throw new Error('puppet is unavailable');
  const clipCatalog = await puppetChannel.clips();
  const idle = clipCatalog.clips.find((entry) => entry.action === 'idle');
  if (!idle) throw new Error('standing idle clip is unavailable');
  const idleClip = idle.format === 'fbx' ? { ...idle, format: 'tracks', bytes: await puppetChannel.trackBytes(avatar.contentHash, idle) } : { ...idle, bytes: await puppetChannel.clipBytes(idle) };
  const bytes = await puppetChannel.bytes(id, avatar.contentHash);
  if (!current()) throw new Error('puppet load replaced');
  if (!puppetRuntime) throw new Error('puppet renderer unavailable');
  const loaded = await puppetRuntime.load(bytes, idleClip, current, () => puppetChannel.select(id));
  if (!loaded) throw new Error('puppet load replaced');
  const clips = [];
  for (const entry of clipCatalog.clips) if (entry !== idle) clips.push(entry.format === 'fbx' ? { ...entry, format: 'tracks', bytes: await puppetChannel.trackBytes(avatar.contentHash, entry) } : { ...entry, bytes: await puppetChannel.clipBytes(entry) });
  if (!current()) throw new Error('puppet load replaced');
  await puppetRuntime.loadClips(clips);
  if (!current()) throw new Error('puppet load replaced');
  $('puppet-credit').textContent = avatar.licenseFlags.creditRequired ? avatar.creditLine : '';
  $('puppet-choice').value = id;
  puppetActive = id;
  puppetScope = token.endpoint_id;
  puppetReady = true;
  syncPuppetUi();
}

async function loadPrivatePuppets() {
  const epoch = puppetEpoch;
  puppetCatalog = await puppetChannel.catalog();
  if (epoch !== puppetEpoch) throw new Error('puppet catalog replaced');
  $('puppet-choice').replaceChildren(...puppetCatalog.avatars.map((avatar, index) => {
    const option = document.createElement('option');
    option.value = avatar.id;
    option.textContent = `puppet ${index + 1}`;
    return option;
  }));
  await showPuppet(puppetCatalog.active);
  puppetChannel.preload(puppetCatalog.avatars, puppetCatalog.active).catch(() => {});
}

$('puppet').addEventListener('click', toggleConversation);
$('puppet').addEventListener('keydown', (event) => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  toggleConversation();
});
$('share-file').addEventListener('change', () => { try { chooseImage($('share-file').files[0]); } catch (error) { chooseImage(); setStatus(error.message, 'err'); } });
$('share-remove').addEventListener('click', () => { $('share-file').value = ''; chooseImage(); });
$('share-text').addEventListener('paste', (event) => {
  const image = [...event.clipboardData.files].find((file) => file.type.startsWith('image/'));
  if (image) try { chooseImage(image); } catch (error) { setStatus(error.message, 'err'); }
});
for (const name of ['dragenter', 'dragover']) $('share-target').addEventListener(name, (event) => { event.preventDefault(); $('share-target').classList.add('over'); });
for (const name of ['dragleave', 'drop']) $('share-target').addEventListener(name, (event) => { event.preventDefault(); $('share-target').classList.remove('over'); });
$('share-target').addEventListener('drop', (event) => { try { chooseImage([...event.dataTransfer.files].find((file) => file.type.startsWith('image/'))); } catch (error) { setStatus(error.message, 'err'); } });
$('share-send').addEventListener('click', () => submitShare().catch((error) => setStatus(error.message, 'err')));
$('puppet-choice').addEventListener('change', () => showPuppet($('puppet-choice').value).catch((error) => {
  if (puppetActive) $('puppet-choice').value = puppetActive;
  setStatus(error.message, 'err');
}));
$('connect').addEventListener('click', () => start($('token').value).catch((error) => setStatus(error.message, 'err')));
$('token-toggle').addEventListener('click', () => setTokenPanel($('token-toggle').getAttribute('aria-expanded') !== 'true'));
$('mic-mute').addEventListener('click', () => setMicrophoneMuted(!microphoneMuted));
$('reenter').addEventListener('click', async () => { listening = false; await stopConversation(); setStatus('finishing private uploads…'); await persistenceUploads.idle(); await telemetry.idle(); savedState(false); $('token').focus(); });
$('forget').addEventListener('click', async () => { listening = false; await stopConversation(); localStorage.removeItem(KEY); setStatus('finishing private uploads…'); await persistenceUploads.idle(); await telemetry.idle(); await sendFrame('bye').catch(() => {}); generation++; connected = false; resetPuppetConnection(new Error('connection replaced'), true); await puppetChannel.clearCache().catch(() => {}); savedState(false); setStatus('token forgotten'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) puppetRuntime?.pause(); else if (!$('conversation').classList.contains('hidden')) puppetRuntime?.start(); });
window.addEventListener('beforeunload', () => puppetRuntime?.dispose());
const saved = configuredToken(config, localStorage.getItem(KEY));
if (saved) { setTokenPanel(false); start(saved).catch((error) => { localStorage.removeItem(KEY); savedState(false); setStatus(error.message, 'err'); }); }
if (config.serviceWorker && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
