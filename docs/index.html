<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="img-src 'self'; media-src blob:;">
<title>voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0c; color: #e6e6e6; font: 16px/1.4 system-ui, sans-serif;
         min-height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: #9a9a9a; font-size: 14px; }
  #status.err { color: #ff6b6b; } #status.ok { color: #6bd47a; }
  .row { display: flex; gap: 8px; padding: 8px 16px; align-items: center; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 80px; background: #151517; color: inherit; border: 1px solid #333; border-radius: 6px; padding: 8px; }
  button { background: #1d1d20; color: inherit; border: 1px solid #3a3a3f; border-radius: 6px; padding: 8px 14px; font: inherit; }
  button.primary { background: #2c5cff; border-color: #2c5cff; }
  .hidden { display: none !important; }
  #talk { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #hold { width: min(70vw, 320px); height: min(70vw, 320px); border-radius: 50%; font-size: 24px;
          background: #1d1d20; border: 3px solid #3a3a3f; touch-action: none; user-select: none; -webkit-user-select: none; }
  #hold.on { background: #b3261e; border-color: #ff6b6b; }
  #log { padding: 0 16px 16px; font-size: 15px; white-space: pre-wrap; }
  #log .me { color: #9fb7ff; } #log .hub { color: #e6e6e6; }
</style>
</head>
<body>
<header>
  <h1>voice</h1>
  <span id="status">paste token to connect</span>
</header>

<div id="entry">
  <div class="row">
    <textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false" inputmode="text"></textarea>
  </div>
  <div class="row">
    <button id="connect" class="primary">Connect</button>
  </div>
</div>

<div id="saved" class="row hidden">
  <span>🔒 token saved on this device</span>
  <button id="reenter">Use a different token</button>
  <button id="forget">Forget token</button>
</div>

<div id="talk" class="hidden">
  <button id="hold">hold to talk</button>
</div>
<div id="log"></div>

<script type="module">
import wbgInit, { init as wasmInit, connect, send_only, recv } from 'https://bddap-bot.github.io/botq/botq_dash_wasm.js';
import { createPtt, wavSink, labeller } from './ptt.js';

const KEY = 'voice.token';
const ALPN = 'voice-web/1';
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function setStatus(text, cls = '') { $('status').textContent = text; $('status').className = cls; }
function showSavedState(saved) { $('entry').classList.toggle('hidden', saved); $('saved').classList.toggle('hidden', !saved); }
function say(cls, text) {
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  $('log').prepend(d);
}
function b64urlToText(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return dec.decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
}

let token = null;
let gen = 0;
let listener = null;
const blocked = new Map();
const played = new Set();
let audioCtx = null;
const ctx = () => {
  audioCtx ??= new AudioContext();
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  return audioCtx;
};
const hold = $('hold');
const label = labeller((t) => { hold.textContent = t; });

let queue = Promise.resolve();
const sendFrame = (f) => {
  const bytes = typeof f === 'string' ? enc.encode(f) : f;
  const g = gen;
  const p = queue.then(() => (g === gen ? send_only(bytes) : Promise.reject(new Error('stream replaced'))));
  queue = p.catch(() => {});
  return p;
};

async function hangUp() {
  const old = listener;
  if (!old) return;
  gen++;
  const settled = Promise.race([old.then(() => true), sleep(5000).then(() => false)]);
  await Promise.race([sendFrame('bye').catch(() => {}), sleep(5000)]);
  if (!await settled) throw new Error('the old stream is stuck; reload the page');
  listener = null;
}

async function dial() {
  await hangUp();
  await connect(token.relay_url ? `${token.endpoint_id}@${token.relay_url}` : token.endpoint_id, ALPN);
  await sendFrame(JSON.stringify({ auth: token.secret }));
  if (!JSON.parse(dec.decode(await recv())).ok) throw new Error('wrong token');
  const my = ++gen;
  listener = listen(my);
  return my;
}

async function listen(my) {
  try {
    for (;;) {
      const f = await recv();
      if (my !== gen) return;
      const nl = f.indexOf(10);
      const head = dec.decode(nl < 0 ? f : f.subarray(0, nl));
      const body = nl < 0 ? new Uint8Array() : f.subarray(nl + 1);
      const [verb, ...args] = head.split(' ');
      if (verb === 'reply') onReply(args, body);
      else if (verb === 'sent') { label.sent(); say('me', `🎙 sent ${(Number(args[0]) / 32000).toFixed(1)}s`); }
      else if (verb === 'error') { console.warn('voice-web:', dec.decode(body)); label.idle(); setStatus('the hub refused that note', 'err'); }
    }
  } catch (e) {
    if (my !== gen) return;
    console.warn('stream lost:', e);
    label.idle();
    setStatus('connection lost, reconnecting…', 'err');
    await sleep(3000);
    if (my === gen) session();
  }
}

function onReply([stamp, t, w], body) {
  const tlen = Number(t), wlen = Number(w);
  if (!stamp || body.length !== tlen + wlen) { console.warn('bad reply frame', stamp, body.length, tlen, wlen); return setStatus('garbled reply', 'err'); }
  if (blocked.has(stamp)) return;
  label.reply();
  if (played.has(stamp)) { sendFrame(`ack\n${stamp}`).catch(() => {}); return; }
  const url = URL.createObjectURL(new Blob([body.subarray(tlen)], { type: 'audio/wav' }));
  const audio = new Audio(url);
  const text = dec.decode(body.subarray(0, tlen));
  const ack = () => { played.add(stamp); sendFrame(`ack\n${stamp}`).catch(() => {}); say('hub', text); };
  const ended = new Promise((r) => { audio.onended = r; audio.onerror = r; setTimeout(r, 120000); }).then(() => URL.revokeObjectURL(url));
  const entry = { audio, ack, ended };
  const failed = (e) => { ack(); console.warn('reply playback:', e); setStatus('reply failed to play', 'err'); };
  audio.play().then(ack).catch((e) => {
    if (e?.name === 'NotAllowedError') { blocked.set(stamp, entry); setStatus('tap to hear the reply', 'err'); }
    else failed(e);
  });
}
document.addEventListener('pointerdown', () => {
  const queued = [...blocked.values()];
  blocked.clear();
  const chain = (i) => {
    if (i >= queued.length) return;
    const { audio, ack, ended } = queued[i];
    audio.play().then(() => { ack(); return ended; }, (e) => { ack(); console.warn('reply playback:', e); setStatus('reply failed to play', 'err'); }).then(() => chain(i + 1));
  };
  chain(0);
}, true);

async function session() {
  setStatus('connecting…');
  for (;;) {
    try { await dial(); break; }
    catch (e) {
      console.warn('connect:', e);
      if (e?.message === 'wrong token') { showSavedState(false); $('talk').classList.add('hidden'); return setStatus('wrong token, paste a new one', 'err'); }
      setStatus('cannot reach the hub, retrying…', 'err');
      await sleep(3000);
    }
  }
  setStatus('connected', 'ok');
}

function capture(stream) {
  const c = ctx();
  const src = c.createMediaStreamSource(stream);
  const proc = c.createScriptProcessor(4096, 1, 1);
  let cb = () => {};
  proc.onaudioprocess = (e) => cb(e.inputBuffer.getChannelData(0).slice());
  src.connect(proc); proc.connect(c.destination);
  return { rate: c.sampleRate, onChunk: (f) => { cb = f; }, close: () => { proc.disconnect(); src.disconnect(); } };
}
async function upload(wav) {
  const frame = new Uint8Array(6 + wav.length);
  frame.set(enc.encode('utter\n')); frame.set(wav, 6);
  await sendFrame(frame);
}
const onState = (s) => {
  console.log('ptt:', s);
  if (s === 'opening mic') return;
  if (s === 'listening') { label.listening(); return setStatus('connected', 'ok'); }
  if (s === 'sending') return label.sending();
  label.idle();
  setStatus(s.split(':')[0], /fail|refused/.test(s) ? 'err' : '');
};
const ptt = createPtt({ mediaDevices: navigator.mediaDevices, sink: wavSink({ capture, upload, onState }), onState });
const down = (e) => {
  e.preventDefault();
  ctx();
  hold.classList.add('on');
  ptt.hold().catch((err) => onState(`hold failed: ${err}`));
};
const up = (e) => { e.preventDefault(); hold.classList.remove('on'); ptt.release().catch((err) => onState(`release failed: ${err}`)); };
hold.addEventListener('pointerdown', down);
hold.addEventListener('pointerup', up);
hold.addEventListener('pointercancel', up);
hold.addEventListener('pointerleave', (e) => { if (ptt.held) up(e); });
hold.addEventListener('contextmenu', (e) => e.preventDefault());

let wasm = null;
async function start(raw) {
  setStatus('decoding token…');
  let t;
  try { t = JSON.parse(b64urlToText(raw.trim())); }
  catch { return setStatus('that does not look like a token', 'err'); }
  if (!t.endpoint_id || !t.secret) return setStatus('that token is missing pieces', 'err');
  token = t;
  setStatus('loading wasm…');
  wasm ??= wbgInit().then(() => wasmInit());
  await wasm;
  localStorage.setItem(KEY, raw.trim());
  $('token').value = '';
  showSavedState(true);
  $('talk').classList.remove('hidden');
  await session();
}

$('connect').addEventListener('click', () => start($('token').value));
$('reenter').addEventListener('click', () => { $('token').value = ''; showSavedState(false); $('token').focus(); });
$('forget').addEventListener('click', async () => {
  localStorage.removeItem(KEY);
  await hangUp().catch(() => {});
  showSavedState(false);
  $('talk').classList.add('hidden');
  setStatus('token forgotten');
});

const saved = localStorage.getItem(KEY);
if (saved) { showSavedState(true); start(saved); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
