<style>
  :root { color-scheme: dark; --stage-column: 32%; --feet: .892; --desk: 80px; }
  * { box-sizing: border-box; }
  html { background: #08090d; }
  body { margin: 0; min-height: 100vh; background: #08090d; color: #f4eee5; font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
  header { position: fixed; z-index: 8; top: 18px; left: 22px; display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; border: 1px solid #51493f; border-radius: 4px; background: #171619e6; box-shadow: 0 12px 34px #0008; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .05em; }
  #status { color: #a5a5aa; } #status.err { color: #ff8585; } #status.ok { color: #75dc8b; }
  .hidden { display: none !important; }
  .entry, .saved { position: fixed; z-index: 9; top: 76px; left: 22px; width: min(var(--stage-column) - 2 * 22px, 430px); padding: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: #171619e6; border: 1px solid #51493f; }
  textarea { flex: 1 1 440px; min-height: 72px; background: #151517; color: inherit; border: 1px solid #39393f; border-radius: 8px; padding: 10px; }
  button { background: #1d1d20; color: inherit; border: 1px solid #414148; border-radius: 8px; padding: 9px 14px; font: inherit; }
  button.primary { background: #315ee8; border-color: #315ee8; }
  main { --stage-height: 100vh; --canvas-height: min(100%, (100% - var(--desk)) / var(--feet)); position: relative; height: var(--stage-height); min-height: 540px; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse at 50% 34%, #51443d 0, #29252a 40%, #111219 72%); }
  main::before, main::after { content: ''; position: absolute; z-index: -1; top: 0; bottom: 0; width: 34%; background: linear-gradient(105deg, #0b0d13, #252027); border-right: 1px solid #70604c55; clip-path: polygon(0 0, 100% 13%, 100% 87%, 0 100%); }
  main::after { right: 0; transform: scaleX(-1); }
  .display, .ledger { background: linear-gradient(145deg, #201e22ee, #111217ee); border: 1px solid #6d5c49; border-radius: 4px; box-shadow: 0 18px 42px #0008, inset 0 0 35px #8a684111; }
  .control::before { content: ''; position: absolute; z-index: 1; left: 30%; top: calc(var(--feet) * var(--canvas-height)); bottom: 0; width: 40%; background: linear-gradient(#665746, #252127); clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%); }
  #puppet { position: absolute; z-index: 2; left: var(--stage-column); top: 0; width: calc(100% - 2 * var(--stage-column)); height: var(--canvas-height); touch-action: manipulation; cursor: pointer; }
  .puppet-picker { position: absolute; z-index: 4; left: 3%; top: calc(100% - 150px); width: 20%; display: flex; gap: 10px; align-items: center; justify-content: center; }
  #puppet-choice { min-width: 150px; background: #1d1d20; color: inherit; border: 1px solid #414148; border-radius: 8px; padding: 8px; }

  .share { position: absolute; z-index: 3; left: 20%; right: 20%; bottom: 10px; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 8px; background: #171619ee; border: 1px solid #594d40; box-shadow: 0 12px 30px #0009; }

  .display { right: 3%; transform: perspective(900px) rotateY(-4deg); }

  .display h2, .ledger h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #a5a5aa; }
  #display-items { display: flex; flex-direction: column; gap: 12px; max-height: calc(100% - 30px); overflow: auto; }
  .display-item { padding: 13px; background: #1b1b1e; border-radius: 8px; overflow-wrap: anywhere; }
  .display-item > :first-child { margin-top: 0; } .display-item > :last-child { margin-bottom: 0; }
  .display-item img { display: block; width: 100%; height: auto; max-height: 52dvh; object-fit: contain; margin-top: 10px; border-radius: 6px; background: #0b0b0c; }

  .tag { color: #8eabff; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .tag.alone { color: #d4ae68; }
  .line { margin-top: 5px; } .key { color: #8f8f96; }
  @media (max-width: 720px), (max-height: 540px) and (pointer: coarse) {

    header { position: absolute; top: calc(var(--visual-viewport-height) + 10px); left: 10px; font-size: 12px; }
    .entry, .saved { position: absolute; top: calc(var(--visual-viewport-height) + 66px); left: 10px; width: calc(100% - 20px); }
    body:has(main.hidden) header { top: 10px; }

    main { --stage-height: 100svh; height: auto; min-height: calc(var(--stage-height) + 940px); overflow: hidden; }
    #puppet { left: 5%; top: 3%; width: 90%; height: calc(var(--stage-height) - 14%); }
    .control::before { left: 5%; top: calc(var(--stage-height) + 12px); width: 90%; height: 150px; }
    .puppet-picker { left: 8%; top: calc(var(--stage-height) + 26px); width: 84%; }
    #puppet-credit { left: 5%; top: calc(var(--stage-height) + 80px); width: 90%; }
    #elapsed { left: 25%; top: calc(var(--stage-height) + 116px); width: 50%; }
    .share { left: 12px; right: 12px; top: calc(var(--stage-height) + 166px); bottom: auto; grid-template-columns: 1fr auto; }
    .share-actions { grid-column: 1 / -1; flex-wrap: wrap; }
    .display, .ledger { left: 12px; right: 12px; width: auto; height: 260px; transform: none; }
    .display { top: calc(var(--stage-height) + 380px); }
    .ledger { top: calc(var(--stage-height) + 670px); }
  }
</style>
</head>
<body>
<header><h1>voice</h1><span id="status">paste token to connect</span></header>
<section id="entry" class="entry">
  <textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false"></textarea>
  <button id="connect" class="primary">Connect</button>
</section>
<section id="saved" class="saved hidden">
  <span>🔒 device authenticated</span><button id="reenter">Use another token</button><button id="forget">Forget token</button>
</section>
<main id="conversation" class="hidden">
  <section class="control">
    <canvas id="puppet" role="button" tabindex="0" aria-pressed="false" aria-label="start conversation" aria-disabled="true"></canvas>
    <label class="puppet-picker">appearance <select id="puppet-choice" aria-label="puppet appearance"></select></label>
    <div id="puppet-credit"></div>
    <div id="elapsed" aria-live="polite">00:00 / 30:00</div>
    <section class="share" aria-label="send text or image">
      <textarea id="share-text" maxlength="8192" placeholder="Paste text, a URL, or an image"></textarea>
      <div id="share-target">Drop or paste an image here</div>
      <div class="share-actions"><label for="share-file"><span class="button">Choose image</span></label><input id="share-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" capture="environment"><button id="share-remove" class="hidden">Remove image</button><span id="share-image">No image selected</span><button id="share-send" class="primary">Send</button></div>
    </section>
  </section>
  <section id="display" class="display" aria-label="hub display"><h2>from the hub</h2><div id="display-items" aria-live="polite"></div></section>
  <section class="ledger"><h2>delegation log</h2><div id="log" aria-live="polite"></div></section>
</main>
<audio id="speaker" autoplay></audio>
<script type="module">
import wbgInit, { init as wasmInit, connect, send_only, recv } from 'https://bddap-bot.github.io/botq/botq_dash_wasm.js';
import { AckUploader, AudioChunker, ConversationTrace, EventBatcher, SessionClock, TranscriptBatcher, errorEvent, formatElapsed, formatStartError, isOfferFor, shareFrame } from './live.js';
import { PuppetChannel } from './puppet-client.js';
import { ListeningReactionDriver, TranscriptActionDriver } from './puppet-drivers.js';
import { PuppetTools, completedToolCall } from './puppet-tools.js';
import { PuppetRuntime } from './puppet.js';

const KEY = 'voice.token';
const ALPN = 'voice-web/1';
const DISPLAY_FRESH_MS = 45000;
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
function syncVisualViewport() {
  const height = Math.round(window.visualViewport?.height ?? window.innerHeight);
  document.documentElement.style.setProperty('--visual-viewport-height', `${height}px`);
  $('conversation').style.setProperty('--stage-height', `${height}px`);
}
syncVisualViewport();
window.visualViewport?.addEventListener('resize', syncVisualViewport);
let token;
let wasm;
let generation = 0;
let listener;
let sendQueue = Promise.resolve();
let answerWaiter;
let conversation;
let usageSeconds = 0;
let connected = false;
let everConnected = false;
let starting;
let stopping;
let puppetCatalog;
let puppetLoadTail = Promise.resolve();
let puppetEpoch = 0;
let puppetRequest;
let puppetLoading = false;
let puppetReady = false;
let displayFreshTimer;
let puppetActive;
let puppetScope;
let puppetRuntime;
let puppetTools;
let selectedImage;
let sharing = false;
const shareWaiters = new Map();
function applyTranscriptAction(action, timing) {
  if (action.kind === 'none') return;
  const pose = puppetRuntime?.poseName ?? null;
  let played = Boolean(puppetRuntime);
  if (action.kind === 'mood') puppetRuntime?.mood(action.name);
  else if (action.kind === 'gesture') played = Boolean(action.name !== 'point' || $('display-items').childElementCount) && Boolean(puppetRuntime?.gesture(action.name, action.name === 'point' ? 'panel' : undefined));
  recordSession('transcript-action', JSON.stringify({ sentence: timing.sentence, token: `${action.kind}:${action.name}`, score: action.score, pose, outcome: played ? 'played' : 'refused', playAtMinusNow: timing.playAtMinusNow }));
}
const actionDriver = new TranscriptActionDriver(applyTranscriptAction);
const listeningDriver = new ListeningReactionDriver((motion) => puppetRuntime?.listening(motion));
const hubWaiting = new Set();
const completedToolCalls = new Set();
const telemetryWaiters = new Map();
const puppetChannel = new PuppetChannel(sendFrame, caches, () => token?.endpoint_id ?? '');
const telemetry = new EventBatcher(sendTelemetry);
const persistenceUploads = new AckUploader(sendBytes, { maximumBytes: 128 * 1024 * 1024, onOverflow: () => recordPageError(new Error('session upload queue is full')) });

function sessionId() { return conversation?.id ?? starting?.offerId ?? null; }
function recordPageError(error, id = sessionId()) { telemetry.add(errorEvent(error, id)); }
function recordSession(name, detail = '', id = sessionId()) { telemetry.add({ kind: 'session', session_id: id, name, detail: String(detail).slice(0, 2048), at: Date.now() }); }
window.addEventListener('error', (event) => recordPageError(event.error || Object.assign(new Error(event.message), { stack: `${event.filename || ''}:${event.lineno || 0}:${event.colno || 0}` })));
window.addEventListener('unhandledrejection', (event) => recordPageError(event.reason));

async function sendTelemetry(events) {
  const batchId = crypto.randomUUID();
  const acknowledged = new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      telemetryWaiters.delete(batchId);
      reject(new Error('telemetry acknowledgment timed out'));
    }, 5000);
    telemetryWaiters.set(batchId, {
      resolve: () => { clearTimeout(timer); telemetryWaiters.delete(batchId); resolve(); },
      reject: (error) => { clearTimeout(timer); telemetryWaiters.delete(batchId); reject(error); },
    });
  });
  try {
    await sendFrame(`telemetry\n${JSON.stringify({ batch_id: batchId, events })}`);
  } catch (error) {
    telemetryWaiters.get(batchId)?.reject(error);
  }
  await acknowledged;
}

function setStatus(text, kind = '') { $('status').textContent = text; $('status').className = kind; }
function savedState(saved) {
  $('entry').classList.toggle('hidden', saved);
  $('saved').classList.toggle('hidden', !saved);
  $('conversation').classList.toggle('hidden', !saved);
  if (saved && !document.hidden) puppetRuntime?.start();
  else puppetRuntime?.pause();
}
function syncPuppetUi() {
  const active = Boolean(conversation);
  const disabled = !puppetReady && !active && !starting;
  $('puppet').setAttribute('aria-disabled', String(disabled));
  $('puppet').setAttribute('aria-pressed', String(active));
  $('puppet').setAttribute('aria-label', active || starting ? 'stop conversation' : 'start conversation');
}
try {
  puppetRuntime = new PuppetRuntime($('puppet'), $('display'));
  puppetRuntime.pause();
  puppetTools = new PuppetTools(puppetRuntime, () => puppetCatalog?.avatars ?? [], () => puppetActive, (id, valid) => showPuppet(id, valid));
} catch (error) {
  console.warn('puppet:', error);
  syncPuppetUi();
}
function resetPuppetConnection(error = new Error('connection replaced'), clearAppearance = false) {
  puppetEpoch++;
  puppetRequest = Symbol('cancelled puppet request');
  puppetLoadTail = Promise.resolve();
  puppetLoading = false;
  puppetCatalog = undefined;
  if (clearAppearance) {
    puppetReady = false;
    puppetActive = undefined;
    puppetScope = undefined;
    puppetRuntime?.clear();
    $('puppet-choice').replaceChildren();
    $('puppet-credit').textContent = '';
  }
  $('puppet-choice').disabled = false;
  puppetChannel.fail(error);
  syncPuppetUi();
}
function decodeToken(raw) {
  let value = raw.trim().replace(/-/g, '+').replace(/_/g, '/');
  while (value.length % 4) value += '=';
  return JSON.parse(dec.decode(Uint8Array.from(atob(value), (char) => char.charCodeAt(0))));
}
function sendFrame(value) {
  return sendBytes(enc.encode(value));
}
function sendBytes(value) {
  const mine = generation;
  const next = sendQueue.then(() => mine === generation ? send_only(value) : Promise.reject(new Error('connection replaced')));
  sendQueue = next.catch(() => {});
  return next;
}
let logNodes = new WeakMap();
let following = true;
function updateFollowing() {
  following = $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight <= 1;
}
$('log').addEventListener('scroll', updateFollowing);
function render(entries) {
  const delegations = entries.filter((entry) => entry.kind === 'delegation');
  if (!delegations.length) {
    $('log').replaceChildren();
    logNodes = new WeakMap();
    updateFollowing();
    return;
  }
  for (const entry of delegations) {
    let record = logNodes.get(entry);
    if (!record) {
    const node = document.createElement('article');
    node.className = 'turn';
    const tag = document.createElement('div');
      const body = document.createElement('div');
    node.append(tag);
      node.append(body);
      $('log').append(node);
      record = { node, tag, body };
      logNodes.set(entry, record);
    }
    record.tag.className = 'tag';
    record.tag.textContent = 'delegated';
    const lines = [['question', entry.sent], ...(entry.reply ? [['answer', entry.reply]] : [])];
    record.body.replaceChildren(...lines.map(([key, value]) => {
      const line = document.createElement('div');
      line.className = 'line';
      const label = document.createElement('span');
      label.className = 'key';
      label.textContent = `${key}: `;
      line.append(label, document.createTextNode(value));
      return line;
    }));
  }
  if (following) $('log').scrollTop = $('log').scrollHeight;
}
let trace = new ConversationTrace(render);

async function listen(mine) {
  try {
    for (;;) {
      const raw = await recv();
      if (mine !== generation) return;
      if (await puppetChannel.receive(raw)) continue;
      const value = dec.decode(raw);
      const at = value.indexOf('\n');
      const verb = at < 0 ? value : value.slice(0, at);
      const body = at < 0 ? '' : value.slice(at + 1);
      if (verb === 'display') receiveDisplay(raw);
      else if (verb === 'answer') {
        const answer = JSON.parse(body);
        if (isOfferFor(answerWaiter, answer)) answerWaiter.resolve(answer);
      }
      else if (verb === 'offer-error') {
        const failure = JSON.parse(body);
        if (isOfferFor(answerWaiter, failure)) answerWaiter.reject(new Error(failure.message));
      }
      else if (verb === 'hub') await receiveHub(JSON.parse(body));
      else if (verb === 'hub-error') await receiveHubError(JSON.parse(body));
      else if (verb === 'share-ok') receiveShare(JSON.parse(body));
      else if (verb === 'share-reply') receiveShareReply(JSON.parse(body));
      else if (verb === 'share-error') receiveShareError(JSON.parse(body));
      else if (verb === 'transcript-ack') {
        const result = JSON.parse(body);
        persistenceUploads.ack(`transcript:${result.session_id}:${result.seq}`);
      }
      else if (verb === 'audio-ack') {
        const result = JSON.parse(body);
        persistenceUploads.ack(`audio:${result.session_id}:${result.side}:${result.seq}`);
      }
      else if (verb === 'telemetry-ack') {
        const result = JSON.parse(body);
        telemetryWaiters.get(result.batch_id)?.resolve();
      }
      else if (verb === 'storage-error') {
        const result = JSON.parse(body);
        const key = result.kind === 'transcript' ? `transcript:${result.session_id}:${result.seq}`
          : result.kind === 'audio' ? `audio:${result.session_id}:${result.side}:${result.seq}` : null;
        if (result.kind === 'telemetry') telemetryWaiters.get(result.batch_id)?.reject(new Error(result.message));
        else if (key) {
          persistenceUploads.fail(key, result.retryable !== false);
          if (result.retryable === false) recordPageError(new Error(result.message));
        }
      }
      else if (verb === 'cap') {
        const capped = JSON.parse(body);
        if (isOfferFor(conversation, capped)) await stopConversation('billing cap reached — conversation stopped');
        else if (isOfferFor(starting, capped)) cancelStarting('billing cap reached — conversation stopped');
      }
      else if (verb === 'error') {
        answerWaiter?.reject(new Error(body));
        answerWaiter = null;
        setStatus(body, 'err');
      }
    }
  } catch (error) {
    if (mine !== generation) return;
    failShares(error);
    answerWaiter?.reject(error);
    answerWaiter = null;
    puppetChannel.fail(error);
    connected = false;
    if (conversation) await stopConversation('connection lost');
    else setStatus('connection lost', 'err');
  }
}
function appendInline(parent, text) {
  const pattern = /(\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`)/g;
  let offset = 0;
  for (const match of text.matchAll(pattern)) {
    parent.append(document.createTextNode(text.slice(offset, match.index)));
    const node = match[2] ? document.createElement('a') : match[4] ? document.createElement('strong') : match[5] ? document.createElement('em') : document.createElement('code');
    node.textContent = match[2] || match[4] || match[5] || match[6];
    if (match[2]) { node.href = match[3]; node.target = '_blank'; node.rel = 'noopener noreferrer'; }
    parent.append(node);
    offset = match.index + match[0].length;
  }
  parent.append(document.createTextNode(text.slice(offset)));
}
function appendMarkdown(parent, markdown) {
  const lines = markdown.split('\n');
  for (let index = 0; index < lines.length;) {
    const line = lines[index];
    if (!line.trim()) { index++; continue; }
    if (line.startsWith('```')) {
      const code = [];
      for (index++; index < lines.length && !lines[index].startsWith('```'); index++) code.push(lines[index]);
      index += index < lines.length ? 1 : 0;
      const pre = document.createElement('pre');
      const content = document.createElement('code'); content.textContent = code.join('\n'); pre.append(content); parent.append(pre);
      continue;
    }
    if (/^[-*] /.test(line)) {
      const list = document.createElement('ul');
      while (index < lines.length && /^[-*] /.test(lines[index])) { const entry = document.createElement('li'); appendInline(entry, lines[index].slice(2)); list.append(entry); index++; }
      parent.append(list); continue;
    }
    const heading = /^(#{1,6})\s+(.+)$/.exec(line);
    const block = document.createElement(heading ? `h${Math.min(heading[1].length + 2, 6)}` : 'p');
    appendInline(block, heading ? heading[2] : line); parent.append(block); index++;
  }
}
function receiveDisplay(raw) {
  const prefix = enc.encode('display\n');
  let boundary = prefix.length;
  while (boundary < raw.length && raw[boundary] !== 10) boundary++;
  if (boundary === raw.length) return;
  let payload;
  try { payload = JSON.parse(dec.decode(raw.slice(prefix.length, boundary))); } catch { return; }
  if (!payload || typeof payload !== 'object') return;
  const item = document.createElement('article');
  item.className = 'display-item';
  if (typeof payload.markdown === 'string') appendMarkdown(item, payload.markdown);
  if (typeof payload.link === 'string' && /^https?:\/\//i.test(payload.link)) {
    const link = document.createElement('a');
    link.href = payload.link; link.textContent = payload.link; link.target = '_blank'; link.rel = 'noopener noreferrer';
    item.append(link);
  }
  if (['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(payload.image?.mime) && boundary + 1 < raw.length && raw.length - boundary - 1 <= 8 * 1024 * 1024) {
    const url = URL.createObjectURL(new Blob([raw.slice(boundary + 1)], { type: payload.image.mime }));
    const image = document.createElement('img');
    image.src = url; image.alt = typeof payload.markdown === 'string' ? payload.markdown.slice(0, 160) : 'Hub image';
    item.append(image);
    item.imageUrl = url;
  }
  if (!item.childNodes.length) return;
  $('display-items').prepend(item);
  while ($('display-items').childNodes.length > 20) { const removed = $('display-items').lastChild; if (removed.imageUrl) URL.revokeObjectURL(removed.imageUrl); removed.remove(); }
  $('display').classList.add('fresh');
  clearTimeout(displayFreshTimer);
  displayFreshTimer = setTimeout(() => $('display').classList.remove('fresh'), DISPLAY_FRESH_MS);
  puppetRuntime?.gesture('point', 'panel');
}
function receiveShare(result) {
