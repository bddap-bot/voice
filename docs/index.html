<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="img-src 'self'; media-src blob:;">
<title>voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: #0b0b0c; color: #ececed; font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: baseline; padding: 16px clamp(16px, 4vw, 36px); border-bottom: 1px solid #26262a; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .05em; }
  #status { color: #a5a5aa; } #status.err { color: #ff8585; } #status.ok { color: #75dc8b; }
  .hidden { display: none !important; }
  .entry, .saved { padding: 18px clamp(16px, 4vw, 36px); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea { flex: 1 1 440px; min-height: 72px; background: #151517; color: inherit; border: 1px solid #39393f; border-radius: 8px; padding: 10px; }
  button { background: #1d1d20; color: inherit; border: 1px solid #414148; border-radius: 8px; padding: 9px 14px; font: inherit; }
  button.primary { background: #315ee8; border-color: #315ee8; }
  main { display: grid; grid-template-columns: minmax(240px, .7fr) minmax(360px, 1.5fr); gap: 18px; padding: clamp(16px, 4vw, 36px); }
  .control, .ledger { background: #141416; border: 1px solid #2d2d31; border-radius: 14px; }
  .control { min-height: 520px; display: grid; grid-template-rows: minmax(380px, 1fr) auto auto auto; gap: 12px; padding: 14px; }
  #toggle { position: relative; width: 100%; min-height: 380px; overflow: hidden; padding: 0; border-radius: 12px; touch-action: manipulation; background: radial-gradient(circle at 50% 35%, #313346, #171820 62%, #101115); }
  #toggle.on { border-color: #50c878; box-shadow: inset 0 0 40px #173e2a; }
  #puppet { display: block; width: 100%; height: 100%; min-height: 380px; }
  #puppet-state { position: absolute; inset: auto 12px 12px; padding: 7px 11px; border-radius: 18px; background: #090a0dbb; font-weight: 650; pointer-events: none; }
  .puppet-picker { display: flex; gap: 10px; align-items: center; justify-content: center; }
  #puppet-choice { min-width: 150px; background: #1d1d20; color: inherit; border: 1px solid #414148; border-radius: 8px; padding: 8px; }
  #puppet-credit { min-height: 21px; color: #bdbdc3; text-align: center; font-size: 13px; }
  #elapsed { font: 28px/1 ui-monospace, monospace; color: #bdbdc3; min-height: 28px; }
  .ledger { min-height: 260px; padding: 18px; overflow: hidden; }
  .ledger h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #a5a5aa; }
  #log { display: flex; flex-direction: column; gap: 10px; max-height: 65dvh; overflow: auto; }
  .turn, .usage { padding: 11px 12px; background: #1b1b1e; border-radius: 8px; overflow-wrap: anywhere; }
  .tag { color: #8eabff; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .tag.alone { color: #d4ae68; }
  .line { margin-top: 5px; } .key { color: #8f8f96; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } .control { min-height: 500px; } }
</style>
</head>
<body>
<header><h1>voice</h1><span id="status">paste token to connect</span></header>
<section id="entry" class="entry">
  <textarea id="token" placeholder="paste your `voice-web token` here" autocomplete="off" spellcheck="false"></textarea>
  <button id="connect" class="primary">Connect</button>
</section>
<section id="saved" class="saved hidden">
  <span>🔒 device authenticated</span><button id="reenter">Use another token</button><button id="forget">Forget token</button>
</section>
<main id="conversation" class="hidden">
  <section class="control">
    <button id="toggle" aria-pressed="false" aria-label="start conversation" disabled><canvas id="puppet"></canvas><span id="puppet-state">loading puppet…</span></button>
    <label class="puppet-picker">appearance <select id="puppet-choice" aria-label="puppet appearance"></select></label>
    <div id="puppet-credit"></div>
    <div id="elapsed" aria-live="polite">00:00 / 30:00</div>
  </section>
  <section class="ledger"><h2>live delegation log</h2><div id="log" aria-live="polite"></div></section>
</main>
<audio id="speaker" autoplay></audio>
<script type="module">
import wbgInit, { init as wasmInit, connect, send_only, recv } from 'https://bddap-bot.github.io/botq/botq_dash_wasm.js';
import { ConversationTrace, SessionClock, formatElapsed, formatStartError, isOfferFor } from './live.js';
import { PuppetChannel } from './puppet-client.js';
import { PuppetRuntime } from './puppet.js';

const KEY = 'voice.token';
const ALPN = 'voice-web/1';
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let token;
let wasm;
let generation = 0;
let listener;
let sendQueue = Promise.resolve();
let answerWaiter;
let conversation;
let usageSeconds = 0;
let connected = false;
let starting;
let stopping;
let puppetCatalog;
let puppetLoadTail = Promise.resolve();
let puppetEpoch = 0;
let puppetRequest;
let puppetLoading = false;
let puppetReady = false;
let puppetActive;
let puppetScope;
let puppetRuntime;
const puppetChannel = new PuppetChannel(sendFrame, caches, () => token?.endpoint_id ?? '');

function setStatus(text, kind = '') { $('status').textContent = text; $('status').className = kind; }
function savedState(saved) {
  $('entry').classList.toggle('hidden', saved);
  $('saved').classList.toggle('hidden', !saved);
  $('conversation').classList.toggle('hidden', !saved);
  if (saved && !document.hidden) puppetRuntime?.start();
  else puppetRuntime?.pause();
}
function syncPuppetUi() {
  const active = Boolean(conversation);
  $('toggle').classList.toggle('on', active);
  $('toggle').disabled = !puppetReady && !active && !starting;
  $('toggle').setAttribute('aria-pressed', String(active));
  $('toggle').setAttribute('aria-label', active || starting ? 'stop conversation' : 'start conversation');
  $('puppet-state').textContent = puppetLoading ? 'loading puppet…' : active ? 'tap to sit and stop voice' : starting ? 'standing… tap to stop' : puppetRuntime ? 'tap to stand and start voice' : 'puppet renderer unavailable';
}
try {
  puppetRuntime = new PuppetRuntime($('puppet'));
  puppetRuntime.pause();
} catch (error) {
  console.warn('puppet:', error);
  syncPuppetUi();
}
function resetPuppetConnection(error = new Error('connection replaced'), clearAppearance = false) {
  puppetEpoch++;
  puppetRequest = Symbol('cancelled puppet request');
  puppetLoadTail = Promise.resolve();
  puppetLoading = false;
  puppetCatalog = undefined;
  if (clearAppearance) {
    puppetReady = false;
    puppetActive = undefined;
    puppetScope = undefined;
    puppetRuntime?.clear();
    $('puppet-choice').replaceChildren();
    $('puppet-credit').textContent = '';
  }
  $('puppet-choice').disabled = false;
  puppetChannel.fail(error);
  syncPuppetUi();
}
function decodeToken(raw) {
  let value = raw.trim().replace(/-/g, '+').replace(/_/g, '/');
  while (value.length % 4) value += '=';
  return JSON.parse(dec.decode(Uint8Array.from(atob(value), (char) => char.charCodeAt(0))));
}
function sendFrame(value) {
  const mine = generation;
  const next = sendQueue.then(() => mine === generation ? send_only(enc.encode(value)) : Promise.reject(new Error('connection replaced')));
  sendQueue = next.catch(() => {});
  return next;
}
let logNodes = new WeakMap();
let following = true;
function updateFollowing() {
  following = $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight <= 1;
}
$('log').addEventListener('scroll', updateFollowing);
function render(entries) {
  if (!entries.length) {
    $('log').replaceChildren();
    logNodes = new WeakMap();
    updateFollowing();
    return;
  }
  for (const entry of entries) {
    let record = logNodes.get(entry);
    if (!record) {
    const node = document.createElement('article');
    node.className = 'turn';
    const tag = document.createElement('div');
      const body = document.createElement('div');
    node.append(tag);
      node.append(body);
      $('log').append(node);
      record = { node, tag, body };
      logNodes.set(entry, record);
    }
    const name = entry.kind === 'heard' ? 'model heard' : entry.kind === 'spoken' ? entry.source : 'delegated';
    record.tag.className = `tag${name === 'model alone' ? ' alone' : ''}`;
    record.tag.textContent = name;
    const lines = entry.kind === 'heard' ? [['heard', entry.text]]
      : entry.kind === 'spoken' ? [['spoke', entry.text]]
      : [['sent to hub', entry.sent], ['context sent', JSON.stringify(entry.context)], ['hub reply', entry.reply || 'waiting…'], ['hub timing', entry.timing === null ? 'waiting…' : `${entry.timing} ms`]];
    record.body.replaceChildren(...lines.map(([key, value]) => {
      const line = document.createElement('div');
      line.className = 'line';
      const label = document.createElement('span');
      label.className = 'key';
      label.textContent = `${key}: `;
      line.append(label, document.createTextNode(value));
      return line;
    }));
  }
  if (following) $('log').scrollTop = $('log').scrollHeight;
}
let trace = new ConversationTrace(render);

async function listen(mine) {
  try {
    for (;;) {
      const raw = await recv();
      if (mine !== generation) return;
      if (await puppetChannel.receive(raw)) continue;
      const value = dec.decode(raw);
      const at = value.indexOf('\n');
      const verb = at < 0 ? value : value.slice(0, at);
      const body = at < 0 ? '' : value.slice(at + 1);
      if (verb === 'answer') {
        const answer = JSON.parse(body);
        if (isOfferFor(answerWaiter, answer)) answerWaiter.resolve(answer);
      }
      else if (verb === 'offer-error') {
        const failure = JSON.parse(body);
        if (isOfferFor(answerWaiter, failure)) answerWaiter.reject(new Error(failure.message));
      }
      else if (verb === 'hub') await receiveHub(JSON.parse(body));
      else if (verb === 'hub-error') await receiveHubError(JSON.parse(body));
      else if (verb === 'cap') {
        const capped = JSON.parse(body);
        if (isOfferFor(conversation, capped)) await stopConversation('billing cap reached — conversation stopped');
        else if (isOfferFor(starting, capped)) cancelStarting('billing cap reached — conversation stopped');
      }
      else if (verb === 'error') {
        answerWaiter?.reject(new Error(body));
        answerWaiter = null;
        setStatus(body, 'err');
      }
    }
  } catch (error) {
    if (mine !== generation) return;
    answerWaiter?.reject(error);
    answerWaiter = null;
    puppetChannel.fail(error);
    connected = false;
    if (conversation) await stopConversation('connection lost');
    else setStatus('connection lost', 'err');
  }
}
async function dial() {
  connected = false;
  resetPuppetConnection(new Error('connection replaced'), Boolean(puppetScope && puppetScope !== token.endpoint_id));
  generation++;
  await connect(token.relay_url ? `${token.endpoint_id}@${token.relay_url}` : token.endpoint_id, ALPN);
  await sendFrame(JSON.stringify({ auth: token.secret }));
  if (!JSON.parse(dec.decode(await recv())).ok) throw new Error('wrong token');
  connected = true;
  listener = listen(generation);
}
function waitForAnswer(id) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      answerWaiter = null;
      reject(new Error('SDP exchange timed out'));
    }, 30000);
    answerWaiter = {
      id,
      resolve: (value) => { clearTimeout(timer); resolve(value); },
      reject: (error) => { clearTimeout(timer); reject(error); },
    };
  });
}
function waitIce(pc, attempt) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const finish = () => {
      pc.removeEventListener('icegatheringstatechange', onChange);
      attempt.cancelIce = null;
      resolve();
    };
    const onChange = () => { if (pc.iceGatheringState === 'complete') finish(); };
    attempt.cancelIce = finish;
    pc.addEventListener('icegatheringstatechange', onChange);
  });
}
function openMicrophone(attempt) {
  let rejectCancellation;
  const cancelled = new Promise((_, reject) => { rejectCancellation = reject; });
  attempt.cancelMic = () => rejectCancellation(new Error('conversation start cancelled'));
  const pending = navigator.mediaDevices.getUserMedia({ audio: true });
  pending.then((stream) => {
    if (attempt.cancelled) for (const track of stream.getTracks()) track.stop();
  }).catch(() => {});
  return Promise.race([pending, cancelled]).finally(() => { attempt.cancelMic = null; });
}
function waitData(channel, predicate, timeout = 10000, attempt = null) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const finish = (action, value) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      channel.removeEventListener('message', onMessage);
      if (attempt) attempt.cancelData = null;
      action(value);
    };
    const timer = setTimeout(() => finish(reject, new Error('Live session timed out')), timeout);
    const onMessage = (message) => {
      let event;
      try { event = JSON.parse(message.data); } catch { return; }
      if (!predicate(event)) return;
      finish(resolve, event);
    };
    if (attempt) attempt.cancelData = () => finish(reject, new Error('conversation start cancelled'));
    channel.addEventListener('message', onMessage);
  });
}
function onLiveEvent(message, source) {
  if (source !== conversation?.channel && source !== starting?.channel) return;
  let event;
  try { event = JSON.parse(message.data); } catch { return; }
  if (event.type === 'session.input_transcript.delta') trace.heard(event.delta ?? '', Date.now(), event.start_ms);
  else if (event.type === 'session.output_transcript.delta') trace.spoke(event.delta ?? '', event.start_ms, event.end_ms);
  else if (event.type === 'session.delegation.created') {
    const id = event.delegation?.id;
    if (!id) return setStatus('Live delegation had no id', 'err');
    const turn = trace.delegated(id);
    if (!turn.sent) return setStatus('Live delegated before producing a transcript', 'err');
    sendFrame(`delegate\n${JSON.stringify({ id, text: turn.sent, context: turn.context, duration_ms: turn.duration_ms })}`).catch((error) => setStatus(error.message, 'err'));
  } else if (event.type === 'session.usage.updated') usageSeconds = Number(event.usage?.seconds ?? usageSeconds);
  else if (event.type === 'session.closed') {
    usageSeconds = Number(event.usage?.seconds ?? usageSeconds);
    if (source === conversation?.channel) stopConversation('Live session ended', true);
    else cancelStarting();
  }
}
async function receiveHub(result) {
  if (!conversation?.channel || !trace.hub(result.id, result.reply, result.timing_ms)) return;
  conversation.channel.send(JSON.stringify({ type: 'session.commentary.append', event_id: `hub_${result.stamp}`, delegation_id: result.id, content: result.reply }));
  await sendFrame(`hub-ack\n${JSON.stringify({ id: result.id, stamp: result.stamp })}`);
}
async function receiveHubError(result) {
  if (!conversation?.channel || !trace.failed(result.id, result.message)) return;
  conversation.channel.send(JSON.stringify({ type: 'session.commentary.append', event_id: `hub_error_${Date.now()}`, delegation_id: result.id, content: `The hub could not answer this request: ${result.message}. Say that briefly without inventing.` }));
}
function paintOff() {
  puppetRuntime?.pose('sit');
  $('elapsed').textContent = '00:00 / 30:00';
  syncPuppetUi();
}
function cancelOffer(attempt) {
  if (!attempt?.offered || attempt.cancelSent) return;
  attempt.cancelSent = true;
  sendFrame('cancel').catch(() => {});
}
function cancelStarting(reason = 'conversation off') {
  if (!starting) return;
  const attempt = starting;
  starting = null;
  attempt.cancelled = true;
  attempt.cancelMic?.();
  for (const track of attempt.stream?.getTracks() ?? []) track.stop();
  attempt.cancelData?.();
  attempt.channel?.close();
  attempt.pc?.close();
  attempt.cancelIce?.();
  answerWaiter?.reject(new Error('conversation start cancelled'));
  answerWaiter = null;
  cancelOffer(attempt);
  paintOff();
  setStatus(reason, reason === 'conversation off' ? 'ok' : 'err');
}
async function startConversation() {
  const attempt = { cancelled: false, offered: false, cancelSent: false, cancelMic: null, cancelIce: null, cancelData: null, stream: null, pc: null, channel: null };
  starting = attempt;
  puppetRuntime?.pose('stand');
  syncPuppetUi();
  try {
    if (stopping) await stopping;
    if (attempt.cancelled) return;
    if (!connected) {
      await dial();
      await loadPrivatePuppets();
    }
    if (attempt.cancelled) return;
    trace = new ConversationTrace(render);
    render([]);
    usageSeconds = 0;
    setStatus('opening microphone…');
    attempt.stream = await openMicrophone(attempt);
    if (attempt.cancelled) {
      for (const track of attempt.stream.getTracks()) track.stop();
      return;
    }
    attempt.pc = new RTCPeerConnection();
    attempt.channel = attempt.pc.createDataChannel('oai-events');
    const started = waitData(attempt.channel, (event) => event.type === 'session.started', 30000, attempt);
    started.catch(() => {});
    attempt.channel.addEventListener('message', (event) => onLiveEvent(event, attempt.channel));
    attempt.pc.ontrack = (event) => { $('speaker').srcObject = event.streams[0]; };
    for (const track of attempt.stream.getTracks()) attempt.pc.addTrack(track, attempt.stream);
    await attempt.pc.setLocalDescription(await attempt.pc.createOffer());
    await waitIce(attempt.pc, attempt);
    if (attempt.cancelled) return;
    attempt.offerId = crypto.randomUUID();
    const answerPromise = waitForAnswer(attempt.offerId);
    attempt.offered = true;
    await sendFrame(`offer\n${JSON.stringify({ id: attempt.offerId, sdp: attempt.pc.localDescription.sdp })}`);
    if (attempt.cancelled) {
      cancelOffer(attempt);
      return;
    }
    const answer = await answerPromise;
    answerWaiter = null;
    if (attempt.cancelled) return;
    await attempt.pc.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
    await started;
    if (attempt.cancelled) return;
    conversation = { pc: attempt.pc, channel: attempt.channel, stream: attempt.stream, clock: null, id: attempt.offerId };
    const capLabel = formatElapsed(answer.cap_seconds);
    const clock = new SessionClock({ capSeconds: answer.cap_seconds, onTick: (seconds) => { $('elapsed').textContent = `${formatElapsed(seconds)} / ${capLabel}`; }, onCap: () => stopConversation(`${Math.round(answer.cap_seconds / 60)} minute cap reached — conversation stopped`) });
    conversation.clock = clock;
    clock.start();
    puppetRuntime?.pose('listen');
    syncPuppetUi();
    setStatus('live', 'ok');
  } catch (error) {
    if (attempt.cancelled) throw new Error('conversation start cancelled');
    throw error;
  } finally {
    if (conversation?.pc !== attempt.pc) {
      cancelOffer(attempt);
      for (const track of attempt.stream?.getTracks() ?? []) track.stop();
      attempt.channel?.close();
      attempt.pc?.close();
    }
    if (starting === attempt) starting = null;
  }
}
function stopConversation(reason = 'conversation off', remoteClosed = false) {
  if (starting) cancelStarting();
  if (stopping) return stopping;
  stopping = finishStop(reason, remoteClosed).finally(() => { stopping = null; });
  return stopping;
}
async function finishStop(reason, remoteClosed) {
  const current = conversation;
  if (!current) return;
  conversation = null;
  current.clock?.stop();
  for (const track of current.stream.getTracks()) track.stop();
  trace.cancel();
  paintOff();
  sendFrame('cancel').catch(() => {});
  if (!remoteClosed && current.channel.readyState === 'open') {
    const closed = waitData(current.channel, (event) => event.type === 'session.closed', 5000).catch(() => null);
    current.channel.send(JSON.stringify({ type: 'session.close' }));
    const final = await closed;
    usageSeconds = Number(final?.usage?.seconds ?? usageSeconds);
  }
  current.channel.close();
  current.pc.close();
  $('speaker').srcObject = null;
  const cost = usageSeconds * 0.05 / 60;
  const item = document.createElement('div');
  item.className = 'usage';
  item.textContent = `session: ${usageSeconds.toFixed(1)} s · estimated $${cost.toFixed(4)} at $0.05/min`;
  $('log').append(item);
  if (following) $('log').scrollTop = $('log').scrollHeight;
  setStatus(reason, reason === 'conversation off' ? 'ok' : 'err');
}
async function toggleConversation() {
  try {
    if (starting) cancelStarting();
    else if (conversation) await stopConversation();
    else await startConversation();
  } catch (error) {
    if (error.message === 'conversation start cancelled') return;
    if (conversation) await stopConversation('conversation could not start');
    else paintOff();
    console.warn('voice:', error);
    setStatus(`conversation could not start: ${formatStartError(error)}`, 'err');
  }
}
async function start(raw) {
  setStatus('decoding token…');
  try { token = decodeToken(raw); } catch { return setStatus('that does not look like a token', 'err'); }
  if (!token.endpoint_id || !token.secret) return setStatus('that token is missing pieces', 'err');
  setStatus('loading…');
  wasm ??= wbgInit().then(() => wasmInit());
  await wasm;
  await dial();
  localStorage.setItem(KEY, raw.trim());
  $('token').value = '';
  savedState(true);
  setStatus('ready', 'ok');
  loadPrivatePuppets().catch((error) => setStatus(`puppet unavailable: ${error.message}`, 'err'));
}

function showPuppet(id) {
  const epoch = puppetEpoch;
  const request = Symbol('puppet request');
  puppetRequest = request;
  puppetLoading = true;
  $('puppet-choice').disabled = true;
  syncPuppetUi();
  const operation = puppetLoadTail.then(() => loadPuppet(id, epoch, request));
  puppetLoadTail = operation.catch(() => {});
  return operation.finally(() => {
    if (puppetRequest !== request) return;
    puppetLoading = false;
    $('puppet-choice').disabled = false;
    syncPuppetUi();
  });
}

async function loadPuppet(id, epoch, request) {
  const current = () => epoch === puppetEpoch && request === puppetRequest;
  if (!current()) throw new Error('puppet load replaced');
  const avatar = puppetCatalog.avatars.find((item) => item.id === id);
  if (!avatar) throw new Error('puppet is unavailable');
  const bytes = await puppetChannel.bytes(id);
  if (!current()) throw new Error('puppet load replaced');
  if (!puppetRuntime) throw new Error('puppet renderer unavailable');
  const loaded = await puppetRuntime.load(bytes, current, () => puppetChannel.select(id));
  if (!loaded) throw new Error('puppet load replaced');
  if (!current()) throw new Error('puppet load replaced');
  $('puppet-credit').textContent = avatar.licenseFlags.creditRequired ? avatar.creditLine : '';
  $('puppet-choice').value = id;
  puppetActive = id;
  puppetScope = token.endpoint_id;
  puppetReady = true;
  if (conversation) puppetRuntime?.pose('listen');
  else if (starting) puppetRuntime?.pose('stand');
  else paintOff();
}

async function loadPrivatePuppets() {
  const epoch = puppetEpoch;
  puppetCatalog = await puppetChannel.catalog();
  if (epoch !== puppetEpoch) throw new Error('puppet catalog replaced');
  $('puppet-choice').replaceChildren(...puppetCatalog.avatars.map((avatar, index) => {
    const option = document.createElement('option');
    option.value = avatar.id;
    option.textContent = `puppet ${index + 1}`;
    return option;
  }));
  await showPuppet(puppetCatalog.active);
}

$('toggle').addEventListener('click', toggleConversation);
$('puppet-choice').addEventListener('change', () => showPuppet($('puppet-choice').value).catch((error) => {
  if (puppetActive) $('puppet-choice').value = puppetActive;
  setStatus(error.message, 'err');
}));
$('connect').addEventListener('click', () => start($('token').value).catch((error) => setStatus(error.message, 'err')));
$('reenter').addEventListener('click', async () => { await stopConversation(); savedState(false); $('token').focus(); });
$('forget').addEventListener('click', async () => { await stopConversation(); localStorage.removeItem(KEY); await sendFrame('bye').catch(() => {}); generation++; connected = false; resetPuppetConnection(new Error('connection replaced'), true); await puppetChannel.clearCache().catch(() => {}); savedState(false); setStatus('token forgotten'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) puppetRuntime?.pause(); else if (!$('conversation').classList.contains('hidden')) puppetRuntime?.start(); });
window.addEventListener('beforeunload', () => puppetRuntime?.dispose());
const saved = localStorage.getItem(KEY);
if (saved) start(saved).catch((error) => { localStorage.removeItem(KEY); savedState(false); setStatus(error.message, 'err'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
