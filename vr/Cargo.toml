[package]
name = "voice-vr"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
openvr_sys = "2"
ash = "0.38"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
glam = "0.29"
image-webp = "0.2"
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
flate2 = "1"
base64 = "0.22"
font8x8 = { version = "0.3", default-features = false }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
opus = "0.4"
pulseaudio = "0.3"
futures = "0.3"
fastrand = "2"
tract-onnx = "0.21"
sha2 = "0.10"

[build-dependencies]
naga = { version = "26", features = ["wgsl-in", "spv-out"] }
