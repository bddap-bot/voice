[package]
name = "voice-vr"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
openvr_sys = "2"
ash = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.29"
image-webp = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
flate2 = "1"
base64 = "0.22"
font8x8 = { version = "0.3", default-features = false }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
opus = "0.4"
pulseaudio = "0.3"
futures = "0.3"
fastrand = "2"
tract-onnx = "0.21"
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
wat = "1"

[build-dependencies]
naga = { version = "26", features = ["wgsl-in", "spv-out"] }
